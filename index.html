<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biome Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body { font-family: 'Fredoka', sans-serif; overflow: hidden; background-color: #1a1a2e; color: white; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        
        .ui-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .btn { transition: all 0.2s; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .crt-effect {
            pointer-events: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 100; opacity: 0.3;
        }

        #game-ui { display: none; }
        #host-sidebar { display: none; transition: transform 0.3s ease; }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(100%); }

        .stat-bar-container { background: #333; border: 2px solid #222; border-radius: 8px; overflow: hidden; position: relative; }
        .stat-bar-fill { height: 100%; transition: width 0.1s linear; }
        .stat-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
        
        .ability-icon { width: 40px; height: 40px; border-radius: 8px; background: #333; border: 2px solid #555; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #888; transition: all 0.2s; position: relative; }
        .ability-icon.active { border-color: #fbbf24; color: #fbbf24; background: #453205; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); height: 0%; transition: height 0.1s linear; border-radius: 6px; }

        .dead-screen { background: rgba(100, 0, 0, 0.8); display: none; }
    </style>
</head>
<body class="w-full h-full relative">

    <!-- Main Menu -->
    <div id="main-menu" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-[#0f172a] bg-opacity-95">
        <h1 class="text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 tracking-tighter drop-shadow-lg">BIOME ARENA</h1>
        <p class="text-gray-400 mb-10 font-bold tracking-widest">MULTIPLAYER CHAOS</p>
        
        <div class="ui-panel p-8 rounded-2xl w-96 flex flex-col gap-6 shadow-2xl">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Player Name</label>
                <input type="text" id="player-name" class="w-full bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-3 outline-none focus:border-cyan-400 transition-colors" placeholder="Enter your legend name" maxlength="20">
            </div>

            <div class="border-t border-slate-700 my-2 relative">
                <span class="absolute left-1/2 -translate-x-1/2 -top-3 bg-slate-800 px-2 text-xs text-gray-500">JOIN</span>
            </div>

            <div class="flex gap-2">
                <input type="text" id="join-code" class="flex-1 bg-slate-800 text-white border border-slate-600 rounded-lg px-4 py-3 outline-none focus:border-pink-400 font-mono text-center uppercase" placeholder="HOST CODE" maxlength="6">
                <button id="btn-join" class="btn bg-pink-600 hover:bg-pink-500 text-white rounded-lg px-6 py-3 shadow-[0_0_15px_rgba(219,39,119,0.5)]">Join</button>
            </div>

            <div class="border-t border-slate-700 my-2 relative">
                <span class="absolute left-1/2 -translate-x-1/2 -top-3 bg-slate-800 px-2 text-xs text-gray-500">OR</span>
            </div>

            <button id="btn-host" class="btn bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg px-4 py-4 w-full shadow-[0_0_15px_rgba(8,145,178,0.5)] text-lg">Create Hosted World</button>
            <p id="menu-status" class="text-center text-sm text-yellow-400 h-4"></p>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>
    <div class="crt-effect"></div>

    <!-- In-Game UI -->
    <div id="game-ui" class="absolute inset-0 pointer-events-none z-30">
        
        <!-- Top Left: Stats -->
        <div class="absolute top-4 left-4 flex flex-col gap-2 w-64 pointer-events-auto">
            <!-- HP Bar -->
            <div class="stat-bar-container h-8">
                <div id="hp-bar" class="stat-bar-fill bg-gradient-to-r from-red-600 to-red-400" style="width: 100%;"></div>
                <div class="stat-text"><span id="hp-text">1000/1000</span></div>
            </div>
            <!-- XP Bar -->
            <div class="stat-bar-container h-6 border-slate-600 border">
                <div id="xp-bar" class="stat-bar-fill bg-gradient-to-r from-blue-600 to-cyan-400" style="width: 0%;"></div>
                <div class="stat-text text-white">Lvl <span id="lvl-text">1</span> | <span id="xp-text">0</span> XP</div>
            </div>
        </div>

        <!-- Bottom Center: Abilities -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4 pointer-events-auto ui-panel p-2 rounded-xl">
            <div class="ability-icon active" title="Pistol (Left Click)">🔫<div id="cd-shoot" class="cooldown-overlay"></div></div>
            <div class="ability-icon active" title="Grenade (Right Click)">💣<div id="cd-grenade" class="cooldown-overlay"></div></div>
            <div id="icon-jump" class="ability-icon active" title="Double Jump (Space in air)">⏫</div>
            <div id="icon-dash" class="ability-icon" title="Dash (Double tap A/D)">💨<div id="cd-dash" class="cooldown-overlay"></div></div>
            <div id="icon-pound" class="ability-icon" title="Ground Pound (S in air)">☄️<div id="cd-pound" class="cooldown-overlay"></div></div>
        </div>

        <!-- Host Code Display -->
        <div id="host-code-display" class="absolute top-4 right-4 pointer-events-auto ui-panel px-4 py-2 rounded-lg hidden flex gap-3 items-center">
            <span class="text-sm text-gray-400">Code:</span>
            <span id="current-code" class="font-mono text-xl text-cyan-400 font-bold select-all cursor-pointer" title="Click to copy">------</span>
            <button id="toggle-host-panel" class="bg-slate-700 hover:bg-slate-600 p-2 rounded ml-2" title="Toggle Host Menu">⚙️</button>
        </div>

        <!-- Dead Screen -->
        <div id="dead-screen" class="dead-screen absolute inset-0 flex flex-col items-center justify-center pointer-events-auto backdrop-blur-sm z-40">
            <h1 class="text-7xl font-black text-red-500 mb-4 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)]">WASTED</h1>
            <p class="text-2xl mb-8">Respawning in <span id="respawn-timer" class="text-yellow-400 font-bold">15</span>s</p>
            <p class="text-gray-300">You lost all your XP.</p>
        </div>
    </div>

    <!-- Host Sidebar -->
    <div id="host-sidebar" class="absolute top-0 right-0 h-full w-80 ui-panel z-40 sidebar-closed flex flex-col shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
            <h2 class="text-xl font-bold text-cyan-400">Host Control</h2>
            <button id="close-host-panel" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
        </div>
        
        <div class="p-4 border-b border-slate-700">
            <h3 class="text-sm text-gray-500 mb-2 uppercase font-bold tracking-wider">Host State</h3>
            <div class="flex items-center gap-2 mb-2">
                <input type="checkbox" id="host-play-toggle" checked class="w-4 h-4 accent-cyan-500 cursor-pointer">
                <label for="host-play-toggle" class="cursor-pointer text-sm">Host is Playing</label>
            </div>
            <p class="text-xs text-gray-400">If unchecked, host will just spectate.</p>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <h3 class="text-sm text-gray-500 mb-2 uppercase font-bold tracking-wider">Players (<span id="player-count">0</span>)</h3>
            <div id="player-list" class="flex flex-col gap-2">
                <!-- Players injected here -->
            </div>
        </div>
    </div>

<script>
/**
 * BIOME ARENA - Core Logic
 */

// --- Constants & Config ---
const CONFIG = {
    FPS: 60,
    TICK_RATE: 30, // Network sends per second
    TILE_SIZE: 40,
    GRAVITY: 0.8,
    TERMINAL_VELOCITY: 20,
    MAP_WIDTH_TILES: 250, // 10,000px wide
    MAP_HEIGHT_TILES: 40, // 1,600px high
    
    // Player
    BASE_HP: 1000,
    MOVE_SPEED: 6,
    JUMP_FORCE: 14,
    DOUBLE_JUMP_FORCE: 12,
    RESPAWN_TIME: 15000,
    IFRAME_TIME: 2000,
    
    // Combat
    SHOOT_COOLDOWN: 200,
    GRENADE_COOLDOWN: 5000,
    DASH_COOLDOWN: 2000,
    POUND_COOLDOWN: 3000,
    
    // Abilities/Levels
    XP_PER_KILL_BASE: 100,
    LVL_2_XP: 100,  // unlocks nothing (double jump default) but increases hp
    LVL_3_XP: 300,  // dash
    LVL_4_XP: 600,  // pound
    
    // Biomes (X coordinates in px)
    BIOME_ICE_END: 3000,
    BIOME_FOREST_END: 7000,
};

// Tile Types
const T_AIR = 0;
const T_DIRT = 1;
const T_GRASS = 2;
const T_ICE_DEEP = 3;
const T_ICE_SURFACE = 4;
const T_MUD = 5;
const T_JUNGLE_GRASS = 6;
const T_BOUNCE = 7;
const T_WALL = 8; // Invisible boundary

// --- Utility Math ---
const clamp = (num, min, max) => Math.min(Math.max(num, min), max);
const distance = (x1, y1, x2, y2) => Math.sqrt((x2-x1)**2 + (y2-y1)**2);
const rectIntersect = (r1, r2) => {
    return !(r2.x > r1.x + r1.w || 
             r2.x + r2.w < r1.x || 
             r2.y > r1.y + r1.h ||
             r2.y + r2.h < r1.y);
};
const generateId = () => Math.random().toString(36).substring(2, 8).toUpperCase();

// --- Map Generator ---
function generateMap() {
    let map = [];
    for (let y = 0; y < CONFIG.MAP_HEIGHT_TILES; y++) {
        let row = [];
        for (let x = 0; x < CONFIG.MAP_WIDTH_TILES; x++) {
            let px = x * CONFIG.TILE_SIZE;
            
            // Floor
            if (y >= CONFIG.MAP_HEIGHT_TILES - 4) {
                if (px < CONFIG.BIOME_ICE_END) row.push(y === CONFIG.MAP_HEIGHT_TILES - 4 ? T_ICE_SURFACE : T_ICE_DEEP);
                else if (px < CONFIG.BIOME_FOREST_END) row.push(y === CONFIG.MAP_HEIGHT_TILES - 4 ? T_GRASS : T_DIRT);
                else row.push(y === CONFIG.MAP_HEIGHT_TILES - 4 ? T_JUNGLE_GRASS : T_MUD);
                continue;
            }

            // Boundaries
            if (x === 0 || x === CONFIG.MAP_WIDTH_TILES - 1 || y === 0) {
                row.push(T_WALL);
                continue;
            }

            // Procedural Platforms
            row.push(T_AIR);
        }
        map.push(row);
    }

    // Add random platforms based on biomes
    for (let i = 0; i < 80; i++) {
        let px = Math.random() * (CONFIG.MAP_WIDTH_TILES * CONFIG.TILE_SIZE - 200) + 100;
        let tx = Math.floor(px / CONFIG.TILE_SIZE);
        let ty = Math.floor(Math.random() * (CONFIG.MAP_HEIGHT_TILES - 10)) + 5;
        let pWidth = Math.floor(Math.random() * 6) + 3;
        
        let typeSurface, typeDeep;
        if (px < CONFIG.BIOME_ICE_END) { typeSurface = T_ICE_SURFACE; typeDeep = T_ICE_DEEP; }
        else if (px < CONFIG.BIOME_FOREST_END) { typeSurface = T_GRASS; typeDeep = T_DIRT; }
        else { typeSurface = T_JUNGLE_GRASS; typeDeep = T_MUD; }

        for(let w=0; w<pWidth; w++) {
            if(tx+w < CONFIG.MAP_WIDTH_TILES-1) {
                map[ty][tx+w] = typeSurface;
                if(Math.random() > 0.5) map[ty+1][tx+w] = typeDeep;
                
                // Jungle bouncy shrooms
                if (typeSurface === T_JUNGLE_GRASS && Math.random() < 0.1 && w === Math.floor(pWidth/2)) {
                    map[ty-1][tx+w] = T_BOUNCE;
                }
            }
        }
    }
    return map;
}

// --- Game Engine (Runs Authoritatively on Host) ---
class GameEngine {
    constructor() {
        this.map = generateMap();
        this.players = {};
        this.projectiles = [];
        this.items = [];
        this.particles = []; // Server visual hints
        this.lastUpdateTime = performance.now();
    }

    addPlayer(id, name) {
        this.players[id] = {
            id, name,
            x: Math.random() * (CONFIG.MAP_WIDTH_TILES * CONFIG.TILE_SIZE - 200) + 100,
            y: 100,
            w: 30, h: 40,
            vx: 0, vy: 0,
            hp: CONFIG.BASE_HP, maxHp: CONFIG.BASE_HP,
            xp: 0, level: 1,
            dead: false, respawnTime: 0, iframeTimer: CONFIG.IFRAME_TIME,
            inputs: { up: false, down: false, left: false, right: false, jump: false, shoot: false, grenade: false, dash: false, pound: false, mouseX: 0, mouseY: 0 },
            lastShoot: 0, lastGrenade: 0, lastDash: 0, lastPound: 0,
            canDoubleJump: true,
            facingRight: true,
            cheats: { god: false, shotgun: false, grenadier: false }
        };
    }

    removePlayer(id) { delete this.players[id]; }

    updateInputs(id, inputs) {
        if (this.players[id] && !this.players[id].dead) {
            this.players[id].inputs = inputs;
        }
    }

    toggleCheat(playerId, cheatName) {
        if(this.players[playerId]) {
            this.players[playerId].cheats[cheatName] = !this.players[playerId].cheats[cheatName];
            return this.players[playerId].cheats[cheatName];
        }
        return false;
    }

    getSpawnPoint() {
        return {
            x: Math.random() * ((CONFIG.MAP_WIDTH_TILES-2) * CONFIG.TILE_SIZE) + CONFIG.TILE_SIZE,
            y: 100
        };
    }

    tick() {
        const now = performance.now();
        const dt = (now - this.lastUpdateTime) / 1000;
        this.lastUpdateTime = now;

        // Process Players
        for (let id in this.players) {
            let p = this.players[id];
            
            if (p.dead) {
                if (now > p.respawnTime) {
                    p.dead = false;
                    let spawn = this.getSpawnPoint();
                    p.x = spawn.x; p.y = spawn.y;
                    p.hp = p.maxHp; p.vx = 0; p.vy = 0;
                    p.iframeTimer = now + CONFIG.IFRAME_TIME;
                }
                continue; // Skip physics if dead
            }

            let inIframes = now < p.iframeTimer;
            
            // Determine biome attributes
            let frictionX = 0.8;
            let accelX = 2;
            if (p.x < CONFIG.BIOME_ICE_END) { frictionX = 0.98; accelX = 0.5; } // Ice slippery
            else if (p.x > CONFIG.BIOME_FOREST_END) { frictionX = 0.7; accelX = 3; } // Jungle mud sticky

            // Movement X
            if (p.inputs.left) { p.vx -= accelX; p.facingRight = false; }
            if (p.inputs.right) { p.vx += accelX; p.facingRight = true; }
            p.vx *= frictionX;

            // X Collision
            p.x += p.vx;
            this.handleCollision(p, 'x');

            // Movement Y
            p.vy += CONFIG.GRAVITY;
            if (p.vy > CONFIG.TERMINAL_VELOCITY) p.vy = CONFIG.TERMINAL_VELOCITY;
            
            // Ground pound logic (requires lvl 4)
            if (p.inputs.pound && p.level >= 4 && now - p.lastPound > CONFIG.POUND_COOLDOWN && p.vy > 0) {
                p.vy = 25; // Slam down
                p.pounding = true;
                p.lastPound = now;
            }

            p.y += p.vy;
            let onGround = this.handleCollision(p, 'y');

            if (onGround) {
                p.canDoubleJump = true;
                if (p.pounding) {
                    p.pounding = false;
                    this.createExplosion(p.x + p.w/2, p.y + p.h, 100, 300, id); // Splash damage
                }
            }

            // Jumping
            if (p.inputs.jump) {
                if (onGround) {
                    let baseJump = CONFIG.JUMP_FORCE + (p.level * 0.5); // Slightly higher jump per level
                    p.vy = -baseJump;
                    p.inputs.jump = false; // consume input
                } else if (p.canDoubleJump) {
                    p.vy = -CONFIG.DOUBLE_JUMP_FORCE;
                    p.canDoubleJump = false;
                    p.inputs.jump = false;
                }
            }

            // Dashing (requires lvl 3)
            if (p.inputs.dash && p.level >= 3 && now - p.lastDash > CONFIG.DASH_COOLDOWN) {
                p.vx = p.facingRight ? 30 : -30;
                p.lastDash = now;
                p.inputs.dash = false;
            }

            // Check Bouncy tiles
            if (onGround) {
                let tx = Math.floor((p.x + p.w/2) / CONFIG.TILE_SIZE);
                let ty = Math.floor((p.y + p.h + 2) / CONFIG.TILE_SIZE);
                if (ty < CONFIG.MAP_HEIGHT_TILES && this.map[ty][tx] === T_BOUNCE) {
                    p.vy = -20;
                }
            }

            // Bounds check map death
            if (p.y > CONFIG.MAP_HEIGHT_TILES * CONFIG.TILE_SIZE) this.killPlayer(id, "world");

            // Combat (Cannot attack during iFrames)
            if (!inIframes) {
                // Shoot
                if (p.inputs.shoot && now - p.lastShoot > CONFIG.SHOOT_COOLDOWN) {
                    p.lastShoot = now;
                    let angle = Math.atan2(p.inputs.mouseY - (p.y + p.h/2), p.inputs.mouseX - (p.x + p.w/2));
                    
                    if (p.cheats.shotgun) {
                        for(let i=0; i<7; i++) {
                            let spread = angle + (Math.random() - 0.5) * 0.5;
                            this.spawnProjectile(p, spread, 20, 20); // Fast, shorter range
                        }
                    } else {
                        this.spawnProjectile(p, angle, 15, 50);
                    }
                }
                
                // Grenade
                let grenCd = p.cheats.grenadier ? 500 : CONFIG.GRENADE_COOLDOWN;
                if (p.inputs.grenade && now - p.lastGrenade > grenCd) {
                    p.lastGrenade = now;
                    let angle = Math.atan2(p.inputs.mouseY - (p.y + p.h/2), p.inputs.mouseX - (p.x + p.w/2));
                    this.spawnGrenade(p, angle);
                    p.inputs.grenade = false; // Consume click
                }
            }
        }

        // Process Projectiles
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            let proj = this.projectiles[i];
            
            if (proj.type === 'bullet') {
                proj.x += Math.cos(proj.angle) * proj.speed;
                proj.y += Math.sin(proj.angle) * proj.speed;
                proj.life--;

                if (proj.life <= 0 || this.checkMapCollision(proj.x, proj.y)) {
                    this.projectiles.splice(i, 1);
                    continue;
                }

                // Check hit players
                let hitId = this.checkPlayerHit(proj.x, proj.y, 5, proj.ownerId);
                if (hitId) {
                    this.damagePlayer(hitId, proj.damage, proj.ownerId);
                    this.projectiles.splice(i, 1);
                }
            } 
            else if (proj.type === 'grenade') {
                proj.vy += CONFIG.GRAVITY * 0.5;
                proj.x += proj.vx;
                
                // Bounce X
                if (this.checkMapCollision(proj.x, proj.y)) {
                    proj.x -= proj.vx;
                    proj.vx *= -0.5;
                }
                
                proj.y += proj.vy;
                // Bounce Y
                if (this.checkMapCollision(proj.x, proj.y)) {
                    proj.y -= proj.vy;
                    proj.vy *= -0.5;
                    proj.vx *= 0.8; // friction
                }

                proj.timer -= 1000/CONFIG.FPS;
                if (proj.timer <= 0) {
                    this.createExplosion(proj.x, proj.y, 120, 250, proj.ownerId);
                    this.projectiles.splice(i, 1);
                }
            }
        }

        // Process Items (Drops)
        for (let i = this.items.length - 1; i >= 0; i--) {
            let item = this.items[i];
            item.vy += CONFIG.GRAVITY * 0.5;
            item.y += item.vy;
            if (this.checkMapCollision(item.x, item.y + item.r)) {
                item.y -= item.vy;
                item.vy = 0;
            }

            // Pick up
            for (let pid in this.players) {
                let p = this.players[pid];
                if (!p.dead && distance(p.x+p.w/2, p.y+p.h/2, item.x, item.y) < p.w + item.r) {
                    if (item.type === 'xp') {
                        this.addXp(pid, item.val);
                        // Heal 30% max HP on picking up XP drop from kill
                        p.hp = clamp(p.hp + p.maxHp * 0.3, 0, p.maxHp); 
                    }
                    this.items.splice(i, 1);
                    break;
                }
            }
        }
        
        // Clean old particles
        this.particles = this.particles.filter(p => now - p.created < p.life);
    }

    spawnProjectile(owner, angle, speed, damage) {
        this.projectiles.push({
            type: 'bullet',
            x: owner.x + owner.w/2, y: owner.y + owner.h/2,
            angle, speed, damage, ownerId: owner.id, life: 60
        });
    }

    spawnGrenade(owner, angle) {
        let force = 15;
        this.projectiles.push({
            type: 'grenade',
            x: owner.x + owner.w/2, y: owner.y,
            vx: Math.cos(angle) * force, vy: Math.sin(angle) * force - 5,
            timer: 2000, ownerId: owner.id
        });
    }

    createExplosion(x, y, radius, damage, ownerId) {
        this.particles.push({ type: 'exp', x, y, r: radius, created: performance.now(), life: 300 });
        for (let pid in this.players) {
            let p = this.players[pid];
            if (p.dead) continue;
            let dist = distance(x, y, p.x + p.w/2, p.y + p.h/2);
            if (dist < radius + p.w/2) {
                // Damage falloff
                let dmg = damage * (1 - dist/radius);
                this.damagePlayer(pid, dmg, ownerId);
                // Knockback
                let angle = Math.atan2(p.y+p.h/2 - y, p.x+p.w/2 - x);
                p.vx += Math.cos(angle) * 15;
                p.vy += Math.sin(angle) * 15;
            }
        }
    }

    checkPlayerHit(x, y, r, excludeId) {
        let testRect = { x: x-r, y: y-r, w: r*2, h: r*2 };
        for (let id in this.players) {
            if (id === excludeId) continue;
            let p = this.players[id];
            if (p.dead || performance.now() < p.iframeTimer) continue;
            if (rectIntersect(testRect, {x: p.x, y: p.y, w: p.w, h: p.h})) return id;
        }
        return null;
    }

    damagePlayer(id, amount, attackerId) {
        let p = this.players[id];
        if (!p || p.dead || performance.now() < p.iframeTimer || p.cheats.god) return;

        p.hp -= amount;
        if (p.hp <= 0) {
            this.killPlayer(id, attackerId);
        }
    }

    killPlayer(victimId, attackerId) {
        let victim = this.players[victimId];
        if(victim.dead) return;
        victim.dead = true;
        victim.respawnTime = performance.now() + CONFIG.RESPAWN_TIME;
        
        // Drop XP
        let totalXpDrop = CONFIG.XP_PER_KILL_BASE + victim.xp;
        this.items.push({
            type: 'xp', x: victim.x + victim.w/2, y: victim.y + victim.h/2,
            r: 15, vy: -5, val: totalXpDrop
        });

        victim.xp = 0;
        this.recalcStats(victimId);
    }

    addXp(id, amount) {
        let p = this.players[id];
        if(!p) return;
        p.xp += amount;
        this.recalcStats(id);
    }

    recalcStats(id) {
        let p = this.players[id];
        // Level calc
        if (p.xp >= CONFIG.LVL_4_XP) p.level = 4;
        else if (p.xp >= CONFIG.LVL_3_XP) p.level = 3;
        else if (p.xp >= CONFIG.LVL_2_XP) p.level = 2;
        else p.level = 1;

        // Stats based on level
        p.maxHp = CONFIG.BASE_HP + (p.level - 1) * 250;
        if (p.hp > p.maxHp) p.hp = p.maxHp;
    }

    handleCollision(p, axis) {
        let tx1 = Math.floor(p.x / CONFIG.TILE_SIZE);
        let ty1 = Math.floor(p.y / CONFIG.TILE_SIZE);
        let tx2 = Math.floor((p.x + p.w - 1) / CONFIG.TILE_SIZE);
        let ty2 = Math.floor((p.y + p.h - 1) / CONFIG.TILE_SIZE);

        let onGround = false;

        for (let y = ty1; y <= ty2; y++) {
            for (let x = tx1; x <= tx2; x++) {
                if (y >= 0 && y < CONFIG.MAP_HEIGHT_TILES && x >= 0 && x < CONFIG.MAP_WIDTH_TILES) {
                    if (this.map[y][x] !== T_AIR) {
                        let tRect = { x: x * CONFIG.TILE_SIZE, y: y * CONFIG.TILE_SIZE, w: CONFIG.TILE_SIZE, h: CONFIG.TILE_SIZE };
                        
                        if (axis === 'x') {
                            if (p.vx > 0) p.x = tRect.x - p.w; // hit right
                            else if (p.vx < 0) p.x = tRect.x + tRect.w; // hit left
                            p.vx = 0;
                        } else if (axis === 'y') {
                            if (p.vy > 0) { // falling
                                p.y = tRect.y - p.h;
                                onGround = true;
                            } else if (p.vy < 0) { // jumping up hitting ceiling
                                p.y = tRect.y + tRect.h;
                            }
                            p.vy = 0;
                        }
                    }
                }
            }
        }
        return onGround;
    }

    checkMapCollision(px, py) {
        let tx = Math.floor(px / CONFIG.TILE_SIZE);
        let ty = Math.floor(py / CONFIG.TILE_SIZE);
        if (tx < 0 || tx >= CONFIG.MAP_WIDTH_TILES || ty < 0 || ty >= CONFIG.MAP_HEIGHT_TILES) return true;
        return this.map[ty][tx] !== T_AIR;
    }

    getState() {
        return {
            p: this.players,
            pr: this.projectiles.map(p => [Math.round(p.x), Math.round(p.y), p.type === 'grenade'?1:0]), // compressed proj
            i: this.items.map(i => [Math.round(i.x), Math.round(i.y), i.type==='xp'?1:0]),
            pt: this.particles.map(p => [Math.round(p.x), Math.round(p.y), Math.round(p.r), p.type==='exp'?1:0])
        };
    }
}

/**
 * CLIENT RENDERING & INPUT
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let camera = { x: 0, y: 0 };
let myPlayerId = null;
let gameState = null;
let gameMap = null; // Received once
let isHost = false;

// Input tracking
const keys = { w:false, a:false, s:false, d:false, space:false };
const mouse = { x:0, y:0, left:false, right:false };
let lastDoubleTapTime = { a: 0, d: 0 };
let pendingInputs = { jump: false, dash: false, pound: false, shoot: false, grenade: false };

window.addEventListener('keydown', (e) => {
    let key = e.key.toLowerCase();
    if(keys.hasOwnProperty(key)) keys[key] = true;
    if(e.code === 'Space') { keys.space = true; pendingInputs.jump = true; }
    if(key === 's') pendingInputs.pound = true;
    
    // Double tap dash logic
    if (key === 'a' || key === 'd') {
        const now = performance.now();
        if (now - lastDoubleTapTime[key] < 300) pendingInputs.dash = true;
        lastDoubleTapTime[key] = now;
    }
});
window.addEventListener('keyup', (e) => {
    let key = e.key.toLowerCase();
    if(keys.hasOwnProperty(key)) keys[key] = false;
    if(e.code === 'Space') keys.space = false;
});
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', (e) => {
    if(e.button === 0) { mouse.left = true; pendingInputs.shoot = true; }
    if(e.button === 2) { mouse.right = true; pendingInputs.grenade = true; }
});
canvas.addEventListener('mouseup', (e) => {
    if(e.button === 0) mouse.left = false;
    if(e.button === 2) mouse.right = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resizeCanvas);

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();

function getPackagedInput() {
    // World coordinates for mouse
    let worldMouseX = mouse.x + camera.x;
    let worldMouseY = mouse.y + camera.y;

    let res = {
        up: keys.w, down: keys.s, left: keys.a, right: keys.d,
        jump: pendingInputs.jump, shoot: mouse.left || pendingInputs.shoot, grenade: pendingInputs.grenade,
        dash: pendingInputs.dash, pound: pendingInputs.pound,
        mouseX: worldMouseX, mouseY: worldMouseY
    };
    // reset impulses
    pendingInputs = { jump: false, dash: false, pound: false, shoot: false, grenade: false };
    return res;
}

// --- Drawing ---
const COLORS = {
    [T_DIRT]: '#5d4037', [T_GRASS]: '#4caf50',
    [T_ICE_DEEP]: '#b2ebf2', [T_ICE_SURFACE]: '#e0f7fa',
    [T_MUD]: '#3e2723', [T_JUNGLE_GRASS]: '#1b5e20',
    [T_BOUNCE]: '#ff4081', [T_WALL]: '#111'
};

function render() {
    requestAnimationFrame(render);
    if (!gameState || !gameMap) return;

    let myPlayer = gameState.p[myPlayerId];
    
    // Update Camera
    if (myPlayer && !myPlayer.dead) {
        // Smooth follow
        let targetCamX = myPlayer.x + myPlayer.w/2 - canvas.width/2;
        let targetCamY = myPlayer.y + myPlayer.h/2 - canvas.height/2;
        camera.x += (targetCamX - camera.x) * 0.1;
        camera.y += (targetCamY - camera.y) * 0.1;
    }
    
    // Clamp camera
    camera.x = Math.max(0, Math.min(camera.x, CONFIG.MAP_WIDTH_TILES * CONFIG.TILE_SIZE - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, CONFIG.MAP_HEIGHT_TILES * CONFIG.TILE_SIZE - canvas.height));

    // Draw Background Based on Camera X
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    let cxCenter = camera.x + canvas.width/2;
    if (cxCenter < CONFIG.BIOME_ICE_END) {
        let gradient = ctx.createLinearGradient(0,0, 0, canvas.height);
        gradient.addColorStop(0, '#001a33'); gradient.addColorStop(1, '#004d99');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0, canvas.width, canvas.height);
        // Simple snow
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for(let i=0; i<50; i++) {
            ctx.fillRect(((camera.x*0.5 + i*100) % canvas.width), (performance.now()*0.05 + i*50) % canvas.height, 4, 4);
        }
    } else if (cxCenter < CONFIG.BIOME_FOREST_END) {
        let gradient = ctx.createLinearGradient(0,0, 0, canvas.height);
        gradient.addColorStop(0, '#0f172a'); gradient.addColorStop(1, '#1e293b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0, canvas.width, canvas.height);
    } else {
        let gradient = ctx.createLinearGradient(0,0, 0, canvas.height);
        gradient.addColorStop(0, '#0a1a0a'); gradient.addColorStop(1, '#133013');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0, canvas.width, canvas.height);
    }

    ctx.save();
    ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

    // Draw Map
    let startX = Math.max(0, Math.floor(camera.x / CONFIG.TILE_SIZE));
    let endX = Math.min(CONFIG.MAP_WIDTH_TILES, Math.ceil((camera.x + canvas.width) / CONFIG.TILE_SIZE));
    let startY = Math.max(0, Math.floor(camera.y / CONFIG.TILE_SIZE));
    let endY = Math.min(CONFIG.MAP_HEIGHT_TILES, Math.ceil((camera.y + canvas.height) / CONFIG.TILE_SIZE));

    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            let tile = gameMap[y][x];
            if (tile !== T_AIR) {
                ctx.fillStyle = COLORS[tile] || 'magenta';
                ctx.fillRect(x * CONFIG.TILE_SIZE, y * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE + 1, CONFIG.TILE_SIZE + 1); // +1 prevents gaps
                
                // Details
                if (tile === T_GRASS || tile === T_JUNGLE_GRASS) {
                    ctx.fillStyle = tile === T_GRASS ? '#81c784' : '#4caf50';
                    ctx.fillRect(x*CONFIG.TILE_SIZE, y*CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, 6);
                }
                if (tile === T_BOUNCE) {
                    ctx.fillStyle = '#f50057';
                    ctx.beginPath(); ctx.arc(x*CONFIG.TILE_SIZE+20, y*CONFIG.TILE_SIZE+20, 15, 0, Math.PI*2); ctx.fill();
                }
            }
        }
    }

    // Draw Items
    gameState.i.forEach(item => {
        ctx.fillStyle = item[2] === 1 ? '#00e5ff' : '#ffea00'; // XP or other
        ctx.beginPath();
        ctx.arc(item[0], item[1], 10, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    });

    // Draw Players
    const now = performance.now();
    for (let id in gameState.p) {
        let p = gameState.p[id];
        if (p.dead) continue;

        let isMe = id === myPlayerId;
        let inIframes = p.iframeTimer && performance.now() < p.iframeTimer;
        
        // Blink if iframe
        if (inIframes && Math.floor(now / 100) % 2 === 0) continue;

        // Draw Player Body
        ctx.fillStyle = isMe ? (p.cheats.god ? '#fcd34d' : '#ec4899') : '#3b82f6';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        
        // Eye
        ctx.fillStyle = 'white';
        let eyeX = p.facingRight ? p.x + p.w - 10 : p.x + 5;
        ctx.fillRect(eyeX, p.y + 10, 5, 5);

        // God mode aura
        if(p.cheats.god) {
            ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2;
            ctx.strokeRect(p.x-4, p.y-4, p.w+8, p.h+8);
        }

        // Draw Name & HP
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px Fredoka';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x + p.w/2, p.y - 15);
        
        // HP Bar overhead
        ctx.fillStyle = '#333';
        ctx.fillRect(p.x - 5, p.y - 10, p.w + 10, 4);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(p.x - 5, p.y - 10, (p.hp / p.maxHp) * (p.w + 10), 4);
    }

    // Draw Projectiles
    gameState.pr.forEach(proj => {
        if (proj[2] === 0) { // Bullet
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(proj[0], proj[1], 4, 0, Math.PI*2); ctx.fill();
        } else { // Grenade
            ctx.fillStyle = '#10b981';
            ctx.beginPath(); ctx.arc(proj[0], proj[1], 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.stroke();
        }
    });

    // Draw Particles/Explosions
    gameState.pt.forEach(pt => {
        if (pt[3] === 1) { // Explosion
            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.beginPath(); ctx.arc(pt[0], pt[1], pt[2], 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)'; ctx.lineWidth = 4; ctx.stroke();
        }
    });

    ctx.restore();

    // Update Local UI if alive
    updateLocalUI(myPlayer, now);
}

function updateLocalUI(p, now) {
    if (!p) return;

    if (p.dead) {
        document.getElementById('dead-screen').style.display = 'flex';
        let timeLeft = Math.ceil((p.respawnTime - now) / 1000);
        document.getElementById('respawn-timer').innerText = timeLeft > 0 ? timeLeft : 0;
        return;
    } else {
        document.getElementById('dead-screen').style.display = 'none';
    }

    // Stats
    document.getElementById('hp-bar').style.width = `${(p.hp / p.maxHp) * 100}%`;
    document.getElementById('hp-text').innerText = `${Math.ceil(p.hp)}/${p.maxHp}`;
    
    // XP math for bar
    let prevLvlXp = p.level === 1 ? 0 : (p.level === 2 ? CONFIG.LVL_2_XP : (p.level === 3 ? CONFIG.LVL_3_XP : CONFIG.LVL_4_XP));
    let nextLvlXp = p.level === 1 ? CONFIG.LVL_2_XP : (p.level === 2 ? CONFIG.LVL_3_XP : (p.level === 3 ? CONFIG.LVL_4_XP : p.xp));
    let xpProgress = 100;
    if (p.level < 4) {
        xpProgress = ((p.xp - prevLvlXp) / (nextLvlXp - prevLvlXp)) * 100;
    }
    document.getElementById('xp-bar').style.width = `${xpProgress}%`;
    document.getElementById('lvl-text').innerText = p.level;
    document.getElementById('xp-text').innerText = p.xp;

    // Cooldowns UI
    updateCooldownUI('cd-shoot', now - p.lastShoot, CONFIG.SHOOT_COOLDOWN);
    updateCooldownUI('cd-grenade', now - p.lastGrenade, p.cheats.grenadier ? 500 : CONFIG.GRENADE_COOLDOWN);
    
    // Abilities unlocks
    toggleAbilityIcon('icon-dash', p.level >= 3);
    if(p.level >= 3) updateCooldownUI('cd-dash', now - p.lastDash, CONFIG.DASH_COOLDOWN);
    
    toggleAbilityIcon('icon-pound', p.level >= 4);
    if(p.level >= 4) updateCooldownUI('cd-pound', now - p.lastPound, CONFIG.POUND_COOLDOWN);
}

function updateCooldownUI(id, elapsed, total) {
    let el = document.getElementById(id);
    if (!el) return;
    if (elapsed < total) {
        let percent = 100 - (elapsed / total) * 100;
        el.style.height = `${percent}%`;
    } else {
        el.style.height = `0%`;
    }
}
function toggleAbilityIcon(id, active) {
    let el = document.getElementById(id);
    if(active) el.classList.add('active'); else el.classList.remove('active');
}

/**
 * NETWORKING LOGIC
 */
let peer = null;
let connections = {}; // Host stores clients
let hostConn = null; // Client stores host
let engine = null;

const statusTxt = document.getElementById('menu-status');

// --- Host Mode ---
document.getElementById('btn-host').addEventListener('click', () => {
    let name = document.getElementById('player-name').value.trim() || 'HostPlayer';
    statusTxt.innerText = "Creating world...";
    
    // Use alphanumeric short code
    const hostCode = generateId();
    // Prefix to avoid collisions on public server
    const peerId = `biome-arena-${hostCode}`;

    peer = new Peer(peerId, { debug: 0 });

    peer.on('open', (id) => {
        isHost = true;
        myPlayerId = 'host';
        
        // Init Engine
        engine = new GameEngine();
        
        // Add Host Player
        if(document.getElementById('host-play-toggle').checked) {
            engine.addPlayer(myPlayerId, name);
        }

        // Setup UI
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('host-code-display').style.display = 'flex';
        document.getElementById('current-code').innerText = hostCode;
        document.getElementById('host-sidebar').style.display = 'flex';
        updateHostSidebar();

        // Start Server Loop
        setInterval(() => engine.tick(), 1000 / CONFIG.FPS);
        setInterval(() => broadcastState(), 1000 / CONFIG.TICK_RATE);
        
        // We act as local client too, start rendering
        gameMap = engine.map;
        render();

        // Local input loop for host
        setInterval(() => {
            if(engine.players[myPlayerId]) {
                engine.updateInputs(myPlayerId, getPackagedInput());
            }
        }, 1000 / CONFIG.TICK_RATE);
    });

    peer.on('connection', (conn) => {
        conn.on('open', () => {
            // Wait for auth init message
        });

        conn.on('data', (data) => {
            if (data.type === 'init') {
                connections[conn.peer] = conn;
                engine.addPlayer(conn.peer, data.name.substring(0, 20)); // Limit name
                conn.send({ type: 'map', map: engine.map, id: conn.peer });
                updateHostSidebar();
            } else if (data.type === 'input') {
                engine.updateInputs(conn.peer, data.input);
            }
        });

        conn.on('close', () => handleDisconnect(conn.peer));
        conn.on('error', () => handleDisconnect(conn.peer));
    });

    peer.on('error', (err) => {
        statusTxt.innerText = "Failed to host: " + err.type;
        console.error(err);
    });
});

function broadcastState() {
    if (!engine) return;
    gameState = engine.getState(); // Host updates local state directly for render
    
    // Send to clients
    let packedState = { type: 'state', state: gameState };
    for (let id in connections) {
        connections[id].send(packedState);
    }
}

function handleDisconnect(id) {
    if (connections[id]) {
        delete connections[id];
        engine.removePlayer(id);
        updateHostSidebar();
    }
}

// --- Client Mode ---
document.getElementById('btn-join').addEventListener('click', () => {
    let name = document.getElementById('player-name').value.trim() || 'Player' + Math.floor(Math.random()*1000);
    let code = document.getElementById('join-code').value.trim().toUpperCase();
    
    if(!code) { statusTxt.innerText = "Enter a code!"; return; }
    
    statusTxt.innerText = "Connecting...";
    peer = new Peer({ debug: 0 });

    peer.on('open', (id) => {
        const hostPeerId = `biome-arena-${code}`;
        hostConn = peer.connect(hostPeerId, { reliable: true });

        hostConn.on('open', () => {
            statusTxt.innerText = "Joining arena...";
            hostConn.send({ type: 'init', name: name });

            // Start sending inputs
            setInterval(() => {
                if (myPlayerId) {
                    hostConn.send({ type: 'input', input: getPackagedInput() });
                }
            }, 1000 / CONFIG.TICK_RATE);
        });

        hostConn.on('data', (data) => {
            if (data.type === 'map') {
                gameMap = data.map;
                myPlayerId = data.id;
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                render();
            } else if (data.type === 'state') {
                gameState = data.state;
            } else if (data.type === 'kicked') {
                alert("You were kicked by the host.");
                location.reload();
            }
        });

        hostConn.on('close', () => {
            alert("Connection to host lost.");
            location.reload();
        });
        hostConn.on('error', () => {
            statusTxt.innerText = "Connection error.";
        });
    });

    peer.on('error', (err) => {
        statusTxt.innerText = "Error connecting: Check code.";
    });
});

// --- Host UI Interactivity ---
document.getElementById('toggle-host-panel').addEventListener('click', () => {
    let panel = document.getElementById('host-sidebar');
    panel.classList.toggle('sidebar-closed');
    panel.classList.toggle('sidebar-open');
});
document.getElementById('close-host-panel').addEventListener('click', () => {
    document.getElementById('host-sidebar').classList.replace('sidebar-open', 'sidebar-closed');
});

document.getElementById('host-play-toggle').addEventListener('change', (e) => {
    if(!isHost || !engine) return;
    if(e.target.checked) {
        let name = document.getElementById('player-name').value.trim() || 'Host';
        engine.addPlayer('host', name);
    } else {
        engine.removePlayer('host');
        // move camera to middle of map as spectator
        camera.x = (CONFIG.MAP_WIDTH_TILES * CONFIG.TILE_SIZE)/2 - canvas.width/2;
    }
    updateHostSidebar();
});

function updateHostSidebar() {
    if(!isHost || !engine) return;
    const list = document.getElementById('player-list');
    list.innerHTML = '';
    
    let count = Object.keys(engine.players).length;
    document.getElementById('player-count').innerText = count;

    for(let id in engine.players) {
        let p = engine.players[id];
        let el = document.createElement('div');
        el.className = 'bg-slate-700 p-2 rounded flex flex-col gap-2';
        
        // Header
        let header = document.createElement('div');
        header.className = 'flex justify-between items-center';
        header.innerHTML = `<span class="font-bold text-sm ${id==='host'?'text-cyan-400':''}">${p.name} ${id==='host'?'(Host)':''}</span>
                            <span class="text-xs text-gray-400">Lvl ${p.level}</span>`;
        el.appendChild(header);

        // Controls
        let controls = document.createElement('div');
        controls.className = 'flex gap-1 flex-wrap';
        
        let cheats = ['god', 'shotgun', 'grenadier'];
        cheats.forEach(c => {
            let btn = document.createElement('button');
            btn.className = `text-xs px-2 py-1 rounded border border-slate-500 ${p.cheats[c] ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-gray-400'} hover:bg-slate-600`;
            btn.innerText = c;
            btn.onclick = () => {
                let active = engine.toggleCheat(id, c);
                btn.className = `text-xs px-2 py-1 rounded border border-slate-500 ${active ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-gray-400'} hover:bg-slate-600`;
            };
            controls.appendChild(btn);
        });

        if (id !== 'host') {
            let kick = document.createElement('button');
            kick.className = 'text-xs px-2 py-1 rounded bg-red-800 text-white hover:bg-red-600 ml-auto';
            kick.innerText = 'KICK';
            kick.onclick = () => {
                if(connections[id]) {
                    connections[id].send({type: 'kicked'});
                    setTimeout(() => { connections[id].close(); handleDisconnect(id); }, 500);
                }
            };
            controls.appendChild(kick);
        }

        el.appendChild(controls);
        list.appendChild(el);
    }
}

// Copy host code
document.getElementById('current-code').addEventListener('click', function() {
    let text = this.innerText;
    navigator.clipboard.writeText(text).then(() => {
        let old = this.innerText;
        this.innerText = "COPIED!";
        setTimeout(() => this.innerText = old, 1000);
    });
});

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Arena Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Utility animations */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .damage-flash { animation: flash-red 0.2s ease-out; }
        @keyframes flash-red { 0% { background: rgba(255,0,0,0.3); } 100% { background: transparent; } }

        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 3px solid #3b82f6; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- OVERLAY FLASH -->
    <div id="damage-overlay" class="absolute inset-0 pointer-events-none z-50"></div>

    <!-- MAIN MENU -->
    <div id="menu-ui" class="absolute inset-0 flex items-center justify-center bg-slate-900 z-40 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-slate-950">
        <div class="glass-panel p-8 rounded-2xl w-[450px] shadow-2xl flex flex-col items-center">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">SUPER ARENA</h1>
            <p class="text-slate-400 mb-8 text-sm">Multiplayer Platformer Shooter</p>

            <div class="w-full mb-6">
                <label class="block text-sm font-medium text-slate-300 mb-1">Player Name</label>
                <input type="text" id="player-name" maxlength="15" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Enter your name...">
            </div>

            <div class="w-full grid grid-cols-2 gap-4">
                <div class="col-span-2 sm:col-span-1">
                    <button id="btn-host" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-105">
                        Host Game
                    </button>
                </div>
                <div class="col-span-2 sm:col-span-1 flex flex-col">
                    <button id="btn-join" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-105 mb-2">
                        Join Game
                    </button>
                    <input type="text" id="join-code" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white text-center text-sm focus:outline-none focus:border-emerald-500 placeholder-slate-500 uppercase font-mono" placeholder="GAME CODE">
                </div>
            </div>
            
            <div id="connection-status" class="mt-6 text-sm text-yellow-400 hidden flex items-center gap-2">
                <div class="loader"></div> <span id="status-text">Connecting...</span>
            </div>
        </div>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" class="hidden absolute inset-0 pointer-events-none">
        
        <!-- Top HUD -->
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-auto">
            <!-- Stats -->
            <div class="glass-panel p-4 rounded-xl flex flex-col gap-2 w-72">
                <div class="flex justify-between items-end">
                    <span id="hud-name" class="font-bold text-xl">Player</span>
                    <span id="hud-level" class="text-emerald-400 font-black text-lg">Lvl 1</span>
                </div>
                
                <div class="w-full bg-slate-800 rounded-full h-3 mb-1 relative overflow-hidden">
                    <div id="hud-hp-bar" class="bg-red-500 h-full transition-all duration-200" style="width: 100%"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold"><span id="hud-hp-txt">1000/1000</span></div>
                </div>
                
                <div class="w-full bg-slate-800 rounded-full h-2 relative overflow-hidden">
                    <div id="hud-xp-bar" class="bg-emerald-400 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                
                <div id="hud-abilities" class="text-xs text-slate-400 mt-1 flex flex-wrap gap-1">
                    <span class="bg-slate-800 px-2 py-1 rounded text-slate-500" id="ab-double">Double Jump</span>
                    <span class="bg-slate-800 px-2 py-1 rounded text-slate-500" id="ab-dash">Dash (A/D x2)</span>
                    <span class="bg-slate-800 px-2 py-1 rounded text-slate-500" id="ab-pound">Pound (S)</span>
                </div>
            </div>

            <!-- Cooldowns -->
            <div class="glass-panel p-3 rounded-xl flex gap-4">
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full border-2 border-slate-600 relative flex justify-center items-center overflow-hidden">
                        <div id="cd-gun" class="absolute bottom-0 w-full bg-blue-500 opacity-50" style="height: 0%"></div>
                        <span class="relative z-10 text-xs font-bold">PISTOL</span>
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1">Left Click</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full border-2 border-slate-600 relative flex justify-center items-center overflow-hidden">
                        <div id="cd-nade" class="absolute bottom-0 w-full bg-orange-500 opacity-50 transition-all duration-100" style="height: 0%"></div>
                        <span class="relative z-10 text-xs font-bold">GRENADE</span>
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1">Right Click</span>
                </div>
            </div>

            <!-- Host Info Box -->
            <div class="glass-panel p-3 rounded-xl flex flex-col items-end">
                <div class="text-xs text-slate-400">Room Code</div>
                <div id="hud-room-code" class="text-2xl font-mono font-black text-white tracking-widest bg-slate-800 px-3 py-1 rounded cursor-pointer pointer-events-auto" onclick="navigator.clipboard.writeText(this.innerText); alert('Code Copied!')">----</div>
            </div>
        </div>

        <!-- Center Screen Text -->
        <div id="center-message" class="absolute inset-0 flex items-center justify-center hidden">
            <h2 id="center-message-text" class="text-5xl font-black text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">DEAD</h2>
        </div>

        <!-- Sidebar (Players & Host Controls) -->
        <div class="absolute right-0 top-24 bottom-4 w-64 glass-panel rounded-l-xl flex flex-col pointer-events-auto transition-transform duration-300 transform translate-x-0" id="sidebar">
            <div class="p-3 bg-slate-800/80 rounded-tl-xl border-b border-slate-700 flex justify-between items-center cursor-pointer" onclick="toggleSidebar()">
                <span class="font-bold">Players <span id="player-count">(1)</span></span>
                <span id="sidebar-chevron">▶</span>
            </div>
            
            <!-- Host Global Controls -->
            <div id="host-global-controls" class="p-3 border-b border-slate-700 hidden bg-blue-900/30">
                <span class="text-xs font-bold text-blue-300 uppercase block mb-2">Host Settings</span>
                <button id="toggle-spectate" class="w-full bg-slate-700 hover:bg-slate-600 text-xs py-1.5 rounded text-white transition-colors">Switch to Spectator</button>
            </div>

            <div id="player-list" class="flex-1 overflow-y-auto p-2 flex flex-col gap-2">
                <!-- Players inserted here dynamically -->
            </div>
        </div>

    </div>

    <!-- Canvas -->
    <canvas id="game-canvas"></canvas>

<script>
// ==========================================
// CONFIGURATION & CONSTANTS
// ==========================================
const PEER_PREFIX = 'sup-arena-xx-';
const TICK_RATE = 20; // Host broadcasts 20 times per second
const TICK_MS = 1000 / TICK_RATE;

// Game Config
const MAP_W = 4000;
const MAP_H = 3000;
const GRAVITY = 1200;
const JUMP_FORCE = -650;
const MOVE_SPEED = 400;
const DASH_SPEED = 1200;
const MAX_FALL_SPEED = 1000;
const BULLET_SPEED = 1800;
const GRENADE_SPEED = 1200;
const POUND_SPEED = 2000;

// Levels
const LEVELS = [
    { xp: 0, maxHp: 1000 },
    { xp: 100, ability: 'doubleJump', title: 'Double Jump' },
    { xp: 300, ability: 'dash', title: 'Dash' },
    { xp: 600, ability: 'pound', title: 'Pound Down' },
    { xp: 1200, maxHp: 1500, title: 'Max HP Boost' },
    { xp: 2000, maxHp: 2000, title: 'Max HP++' }
];

// Map Platforms
const platforms = [
    // Floor & Borders
    { x: 0, y: MAP_H - 100, w: MAP_W, h: 100, color: '#1e293b' },
    { x: -100, y: 0, w: 100, h: MAP_H, color: '#1e293b' },
    { x: MAP_W, y: 0, w: 100, h: MAP_H, color: '#1e293b' },
    // Platforms
    { x: 400, y: MAP_H - 400, w: 600, h: 30, color: '#334155' },
    { x: 1200, y: MAP_H - 600, w: 400, h: 30, color: '#334155' },
    { x: 1800, y: MAP_H - 800, w: 800, h: 30, color: '#334155' },
    { x: 2800, y: MAP_H - 500, w: 500, h: 30, color: '#334155' },
    
    { x: 800, y: MAP_H - 1000, w: 300, h: 30, color: '#334155' },
    { x: 200, y: MAP_H - 1300, w: 400, h: 30, color: '#334155' },
    { x: 1500, y: MAP_H - 1400, w: 500, h: 30, color: '#334155' },
    { x: 2500, y: MAP_H - 1200, w: 400, h: 30, color: '#334155' },
    
    { x: 1000, y: MAP_H - 1800, w: 600, h: 30, color: '#334155' },
    { x: 2200, y: MAP_H - 1900, w: 500, h: 30, color: '#334155' },
    { x: 3000, y: MAP_H - 1600, w: 400, h: 30, color: '#334155' },
    
    { x: 1600, y: MAP_H - 2300, w: 800, h: 30, color: '#334155' }
];

const spawnZones = [
    { x: 200, y: MAP_H - 200 }, { x: 3800, y: MAP_H - 200 }, 
    { x: 2200, y: MAP_H - 1000 }, { x: 400, y: MAP_H - 1500 },
    { x: 3200, y: MAP_H - 1800 }, { x: 2000, y: MAP_H - 2500 }
];

// ==========================================
// STATE & VARIABLES
// ==========================================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let isHost = false;
let peer = null;
let roomCode = "";
let myId = null;
let isSpectating = false;

// Shared State
let players = {}; 
let projectiles = {}; 
let drops = {};
let particles = [];
let localEvents = []; // For rendering visual effects

// Network Connections (Host side)
let clients = {}; // conn.peer -> conn

// Input State
const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowleft: false, arrowdown: false, arrowright: false };
const mouse = { x: 0, y: 0, left: false, right: false, angle: 0, canvasX: 0, canvasY: 0 };
let lastTaps = { left: 0, right: 0 }; // For double tap dash

// Timers
let lastTime = performance.now();
let gunCooldown = 0;
let nadeCooldown = 0;

// Camera
let cam = { x: 0, y: 0, scale: window.innerHeight / 1000 };

// ID Generators
let projIdCounter = 0;
let dropIdCounter = 0;

// ==========================================
// UTILS
// ==========================================
function genCode() { return Math.random().toString(36).substring(2, 6).toUpperCase(); }
function getSpawn() { const z = spawnZones[Math.floor(Math.random() * spawnZones.length)]; return { x: z.x, y: z.y }; }
function lerp(a, b, t) { return a + (b - a) * t; }
function distance(x1, y1, x2, y2) { return Math.hypot(x2-x1, y2-y1); }

// ==========================================
// UI HANDLING
// ==========================================
document.getElementById('btn-host').addEventListener('click', () => startNetworking(true));
document.getElementById('btn-join').addEventListener('click', () => startNetworking(false));

function startNetworking(asHost) {
    const name = document.getElementById('player-name').value.trim() || 'Player' + Math.floor(Math.random()*1000);
    const codeInput = document.getElementById('join-code').value.trim().toUpperCase();
    
    if (!asHost && codeInput.length === 0) return alert("Enter a join code!");

    document.getElementById('btn-host').disabled = true;
    document.getElementById('btn-join').disabled = true;
    const status = document.getElementById('connection-status');
    status.classList.remove('hidden');

    myId = 'p_' + Math.random().toString(36).substring(2, 9);
    
    if (asHost) {
        roomCode = genCode();
        peer = new Peer(PEER_PREFIX + roomCode);
        document.getElementById('status-text').innerText = "Creating Host Room...";
    } else {
        roomCode = codeInput;
        peer = new Peer();
        document.getElementById('status-text').innerText = "Connecting to Host...";
    }

    peer.on('open', (id) => {
        if (asHost) {
            isHost = true;
            initGame(name);
            startHostLoop();
        } else {
            // Join host
            const conn = peer.connect(PEER_PREFIX + roomCode, { reliable: true });
            conn.on('open', () => {
                clients['host'] = conn;
                conn.send({ type: 'join', id: myId, name: name });
                initGame(name);
            });
            conn.on('data', handleClientData);
            conn.on('close', () => kickPlayer("Host Disconnected."));
            conn.on('error', () => kickPlayer("Connection error."));
            
            setTimeout(() => { if (!clients['host'] || !clients['host'].open) kickPlayer("Failed to connect to host."); }, 5000);
        }
    });

    peer.on('error', (err) => {
        alert("PeerJS Error: " + err.type);
        window.location.reload();
    });

    if (asHost) {
        peer.on('connection', (conn) => {
            conn.on('data', (data) => handleHostData(conn, data));
            conn.on('close', () => removePlayer(conn.peerIdStored));
        });
    }
}

function initGame(name) {
    document.getElementById('menu-ui').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('hud-room-code').innerText = roomCode;
    
    if (isHost) {
        document.getElementById('host-global-controls').classList.remove('hidden');
        addPlayer(myId, name);
    }
    
    resize();
    window.addEventListener('resize', resize);
    
    // Bind Controls
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = true;
        
        // Dash detect
        if (!players[myId]?.isDead && getAbilities(players[myId]?.xp).dash) {
            const now = performance.now();
            if (k === 'a' || k === 'arrowleft') {
                if (now - lastTaps.left < 300) doDash(-1);
                lastTaps.left = now;
            }
            if (k === 'd' || k === 'arrowright') {
                if (now - lastTaps.right < 300) doDash(1);
                lastTaps.right = now;
            }
        }

        // Pound detect
        if ((k === 's' || k === 'arrowdown') && players[myId] && !players[myId].isDead && !players[myId].onGround && getAbilities(players[myId].xp).pound && !players[myId].pounding) {
            players[myId].pounding = true;
            players[myId].vy = POUND_SPEED;
            if(!isHost) sendInputState(); // Immediate update for feel
        }
    });
    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        mouse.canvasX = e.clientX;
        mouse.canvasY = e.clientY;
    });
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) mouse.left = true;
        if (e.button === 2) mouse.right = true;
    });
    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) mouse.left = false;
        if (e.button === 2) mouse.right = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Toggle Spectate
    document.getElementById('toggle-spectate').addEventListener('click', () => {
        isSpectating = !isSpectating;
        document.getElementById('toggle-spectate').innerText = isSpectating ? "Join Game" : "Switch to Spectator";
        if (isSpectating) {
            players[myId].isDead = true; // pseudo dead
            players[myId].x = -1000;
        } else {
            players[myId].isDead = false;
            respawnPlayer(players[myId]);
        }
    });

    requestAnimationFrame(gameLoop);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cam.scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900) * 1.2;
}

let sidebarOpen = true;
function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').style.transform = sidebarOpen ? 'translateX(0)' : 'translateX(100%)';
    document.getElementById('sidebar-chevron').innerText = sidebarOpen ? '▶' : '◀';
}

function kickPlayer(msg = "You have been kicked.") {
    alert(msg);
    window.location.reload();
}

// ==========================================
// GAME LOGIC HELPER FUNCTIONS
// ==========================================
function getAbilities(xp) {
    let abs = { doubleJump: false, dash: false, pound: false, maxHp: 1000, level: 1 };
    for (let i = 0; i < LEVELS.length; i++) {
        if (xp >= LEVELS[i].xp) {
            abs.level = i + 1;
            if (LEVELS[i].ability) abs[LEVELS[i].ability] = true;
            if (LEVELS[i].maxHp) abs.maxHp = LEVELS[i].maxHp;
        }
    }
    return abs;
}

// ==========================================
// HOST LOGIC (AUTHORITATIVE)
// ==========================================
function addPlayer(id, name) {
    const sp = getSpawn();
    players[id] = {
        id: id, name: name.substring(0, 15),
        x: sp.x, y: sp.y, w: 40, h: 40,
        vx: 0, vy: 0,
        hp: 1000, xp: 0,
        onGround: false, jumpsLeft: 1, pounding: false,
        isDead: false, respawnTimer: 0, invulnTimer: 2000,
        aimAngle: 0,
        cheats: { god: false, shotgun: false, grenadier: false },
        lastInputId: 0, // For simple reconciliation
        // Render smoothing
        rx: sp.x, ry: sp.y
    };
    updateSidebar();
}

function removePlayer(id) {
    if (players[id]) {
        delete players[id];
        updateSidebar();
    }
}

function handleHostData(conn, data) {
    const id = data.id;
    if (data.type === 'join') {
        conn.peerIdStored = id;
        clients[id] = conn;
        addPlayer(id, data.name);
    } else if (data.type === 'input' && players[id]) {
        // Client reports its locally simulated position and inputs
        const p = players[id];
        if (p.isDead) return;

        // Basic anti-cheat / validation
        const d = distance(p.x, p.y, data.state.x, data.state.y);
        // If client moved a reasonable amount, accept it. Otherwise ignore to prevent teleports.
        // Tolerant because "not Secure, just fun".
        if (d < 800) {
            p.x = data.state.x;
            p.y = data.state.y;
            p.vx = data.state.vx;
            p.vy = data.state.vy;
            p.onGround = data.state.onGround;
            p.pounding = data.state.pounding;
            if(data.state.pounding === false && p.pounding === true && p.onGround) {
                // Client landed a pound
                triggerPound(p);
            }
        }
        p.aimAngle = data.state.angle;
    } else if (data.type === 'action' && players[id]) {
        handleAction(id, data.action, data.angle);
    }
}

function handleAction(id, actionType, angle) {
    const p = players[id];
    if (!p || p.isDead || p.invulnTimer > 0) return;

    if (actionType === 'shoot') {
        let count = p.cheats.shotgun ? 10 : 1;
        let spread = p.cheats.shotgun ? 0.4 : 0;
        for(let i=0; i<count; i++) {
            let a = angle + (Math.random() * spread - spread/2);
            projectiles[++projIdCounter] = {
                id: projIdCounter, owner: id,
                x: p.x + p.w/2, y: p.y + p.h/2,
                vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED,
                type: 'bullet', life: 1.5,
                radius: 4, color: '#3b82f6', dmg: 50
            };
        }
    } else if (actionType === 'grenade') {
        projectiles[++projIdCounter] = {
            id: projIdCounter, owner: id,
            x: p.x + p.w/2, y: p.y - 10,
            vx: Math.cos(angle) * GRENADE_SPEED, vy: Math.sin(angle) * GRENADE_SPEED - 200, // slight upward arc
            type: 'grenade', life: 2.0, bounce: 0.6,
            radius: 8, color: '#f97316', dmg: 250, splash: 300
        };
    }
}

function triggerPound(p) {
    p.pounding = false;
    spawnExplosion(p.x + p.w/2, p.y + p.h, 250, 150, p.id, '#ef4444');
}

function respawnPlayer(p) {
    const sp = getSpawn();
    p.x = sp.x; p.y = sp.y;
    p.vx = 0; p.vy = 0;
    p.isDead = false;
    p.xp = 0;
    p.hp = getAbilities(0).maxHp;
    p.invulnTimer = 2000;
}

function spawnExplosion(x, y, radius, dmg, ownerId, color) {
    localEvents.push({ type: 'exp', x, y, r: radius, c: color });
    
    // Apply Damage
    for (let pid in players) {
        if (pid === ownerId) continue;
        let p = players[pid];
        if (p.isDead || p.invulnTimer > 0) continue;
        
        let cx = p.x + p.w/2;
        let cy = p.y + p.h/2;
        let dist = distance(x, y, cx, cy);
        
        if (dist < radius + p.w/2) {
            applyDamage(p, dmg * (1 - dist/radius), ownerId); // Damage falloff
        }
    }
}

function applyDamage(target, amt, sourceId) {
    if (target.cheats.god) return;
    target.hp -= amt;
    
    // Notify clients of hit for flash
    localEvents.push({type: 'hit', id: target.id});

    if (target.hp <= 0) {
        target.hp = 0;
        target.isDead = true;
        target.respawnTimer = 15000; // 15 seconds
        
        // Spawn Drops
        const dropVal = target.xp + 50; 
        drops[++dropIdCounter] = {
            id: dropIdCounter, x: target.x + target.w/2, y: target.y,
            vy: -400, vx: (Math.random()-0.5)*200,
            xp: dropVal
        };

        // Transfer all XP logic? Prompt says "Taking down someone else grants you all their XP" via drops, or direct? "collect life drops from them, including XP... Taking down someone else grants you all their XP." We'll put it in a big drop.
    }
}

// Host Main Update Loop (Physics & Interactions)
let lastHostTime = performance.now();
let hostTickTimer = 0;

function startHostLoop() {
    setInterval(() => {
        let now = performance.now();
        let dt = (now - lastHostTime) / 1000;
        lastHostTime = now;
        if(dt > 0.1) dt = 0.1;

        // Update Projectiles
        for (let pid in projectiles) {
            let pr = projectiles[pid];
            pr.life -= dt;
            if (pr.life <= 0) {
                if (pr.type === 'grenade') spawnExplosion(pr.x, pr.y, pr.splash, pr.dmg, pr.owner, '#f97316');
                delete projectiles[pid];
                continue;
            }

            if (pr.type === 'grenade') pr.vy += GRAVITY * dt;
            pr.x += pr.vx * dt;
            pr.y += pr.vy * dt;

            // Collisions with Map
            let hitMap = false;
            for (let plat of platforms) {
                if (pr.x + pr.radius > plat.x && pr.x - pr.radius < plat.x + plat.w &&
                    pr.y + pr.radius > plat.y && pr.y - pr.radius < plat.y + plat.h) {
                    if (pr.type === 'bullet') { hitMap = true; break; }
                    if (pr.type === 'grenade') {
                        // Simple bounce
                        if (pr.y < plat.y || pr.y > plat.y + plat.h) pr.vy *= -pr.bounce;
                        else pr.vx *= -pr.bounce;
                        // Prevent sinking
                        pr.y = Math.min(pr.y, plat.y - pr.radius);
                    }
                }
            }

            if (hitMap) { delete projectiles[pid]; continue; }

            // Collisions with players
            let hitPlayer = false;
            for (let targetId in players) {
                if (targetId === pr.owner) continue;
                let target = players[targetId];
                if (target.isDead) continue;

                if (pr.x > target.x && pr.x < target.x + target.w && pr.y > target.y && pr.y < target.y + target.h) {
                    if (pr.type === 'bullet') {
                        applyDamage(target, pr.dmg, pr.owner);
                        hitPlayer = true;
                        break;
                    } else if (pr.type === 'grenade') {
                        spawnExplosion(pr.x, pr.y, pr.splash, pr.dmg, pr.owner, '#f97316');
                        hitPlayer = true;
                        break;
                    }
                }
            }
            if (hitPlayer) delete projectiles[pid];
        }

        // Update Drops
        for (let did in drops) {
            let d = drops[did];
            d.vy += GRAVITY * dt;
            d.x += d.vx * dt;
            d.y += d.vy * dt;

            // Map Col
            for (let plat of platforms) {
                if (d.x > plat.x && d.x < plat.x + plat.w && d.y + 15 > plat.y && d.y < plat.y + plat.h) {
                    d.y = plat.y - 15;
                    d.vy = 0; d.vx *= 0.9;
                }
            }

            // Player collect
            for (let targetId in players) {
                let target = players[targetId];
                if (target.isDead) continue;
                if (distance(d.x, d.y, target.x + target.w/2, target.y + target.h/2) < 40) {
                    target.xp += d.xp;
                    let abs = getAbilities(target.xp);
                    target.hp = Math.min(target.hp + 200, abs.maxHp); // Heal slightly on pickup
                    delete drops[did];
                    break;
                }
            }
        }

        // Update Players (Timers)
        for (let pid in players) {
            let p = players[pid];
            if (p.isDead) {
                p.respawnTimer -= dt * 1000;
                if (p.respawnTimer <= 0) respawnPlayer(p);
            } else {
                if (p.invulnTimer > 0) p.invulnTimer -= dt * 1000;
                
                // If Host player, update physics locally
                if (pid === myId && !isSpectating) {
                    updatePlayerPhysics(p, dt);
                }
            }
        }

        // Broadcast State
        hostTickTimer += dt * 1000;
        if (hostTickTimer >= TICK_MS) {
            hostTickTimer = 0;
            const state = {
                t: Date.now(),
                pl: players,
                pr: projectiles,
                dr: drops,
                ev: localEvents
            };
            
            // Send to clients
            for (let cid in clients) {
                if (clients[cid].open) clients[cid].send(state);
            }
            
            // Process locally for host
            handleStateUpdate(state);
            localEvents = [];
        }

    }, 1000 / 60);
}

function hostOpCmd(targetId, cmd) {
    if(!isHost || !players[targetId]) return;
    if(cmd === 'kick') {
        if(clients[targetId]) {
            clients[targetId].send({type: 'kicked'});
            setTimeout(()=>clients[targetId].close(), 500);
            delete clients[targetId];
        }
        removePlayer(targetId);
    } else {
        players[targetId].cheats[cmd] = !players[targetId].cheats[cmd];
    }
    updateSidebar();
}

// ==========================================
// CLIENT LOGIC & NETWORKING
// ==========================================
function handleClientData(data) {
    if (data.type === 'kicked') {
        kickPlayer("Host kicked you.");
    } else if (data.pl) { // It's a state update
        handleStateUpdate(data);
    }
}

function handleStateUpdate(state) {
    // Sync external players and entities
    for (let pid in state.pl) {
        if (!players[pid]) players[pid] = state.pl[pid];
        else {
            let s = state.pl[pid];
            // Don't overwrite local position rigidly for smooth movement, except if teleported/respawned
            if (pid === myId && !isSpectating) {
                players[pid].hp = s.hp;
                players[pid].xp = s.xp;
                players[pid].isDead = s.isDead;
                players[pid].respawnTimer = s.respawnTimer;
                players[pid].invulnTimer = s.invulnTimer;
                players[pid].cheats = s.cheats;
                
                // If dead or respawned, snap position
                if (s.isDead || Math.abs(players[pid].x - s.x) > 1000) {
                    players[pid].x = s.x; players[pid].y = s.y;
                }
            } else {
                // Smoothing setup for other players
                players[pid].rx = players[pid].x;
                players[pid].ry = players[pid].y;
                Object.assign(players[pid], s);
            }
        }
    }
    
    // Clean disconnected players
    for (let pid in players) {
        if (!state.pl[pid]) delete players[pid];
    }

    projectiles = state.pr;
    drops = state.dr;

    // Handle Events
    for (let ev of state.ev) {
        if (ev.type === 'exp') {
            for(let i=0; i<30; i++) particles.push(createParticle(ev.x, ev.y, ev.c, ev.r));
        }
        if (ev.type === 'hit' && ev.id === myId) {
            document.getElementById('damage-overlay').classList.remove('damage-flash');
            void document.getElementById('damage-overlay').offsetWidth; // trigger reflow
            document.getElementById('damage-overlay').classList.add('damage-flash');
        }
    }
    
    updateSidebar();
}

function sendInputState() {
    if (isHost || isSpectating || !players[myId]) return;
    const p = players[myId];
    clients['host'].send({
        type: 'input',
        state: { x: p.x, y: p.y, vx: p.vx, vy: p.vy, onGround: p.onGround, pounding: p.pounding, angle: mouse.angle }
    });
}

function sendAction(actionType) {
    if (isSpectating || !players[myId] || players[myId].isDead) return;
    if (isHost) {
        handleAction(myId, actionType, mouse.angle);
    } else {
        clients['host'].send({ type: 'action', action: actionType, angle: mouse.angle });
    }
}

// ==========================================
// CLIENT PHYSICS (Prediction / Local Feel)
// ==========================================
function updatePlayerPhysics(p, dt) {
    if (p.isDead) return;

    let abs = getAbilities(p.xp);
    p.maxJumps = abs.doubleJump ? 2 : 1;

    // Input to Velocity
    let moving = false;
    if (!p.pounding) {
        if (keys.a || keys.arrowleft) { p.vx = -MOVE_SPEED; moving = true; }
        if (keys.d || keys.arrowright) { p.vx = MOVE_SPEED; moving = true; }
        if (!moving && p.onGround) p.vx *= Math.pow(0.001, dt); // Friction
    }

    // Jump
    if ((keys.w || keys.arrowup) && p.jumpsLeft > 0) {
        p.vy = JUMP_FORCE;
        p.onGround = false;
        p.jumpsLeft--;
        keys.w = false; keys.arrowup = false; // Require re-press
    }

    p.vy += GRAVITY * dt;
    if (p.vy > MAX_FALL_SPEED && !p.pounding) p.vy = MAX_FALL_SPEED;

    // Move X
    p.x += p.vx * dt;
    // Bounds
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x > MAP_W - p.w) { p.x = MAP_W - p.w; p.vx = 0; }

    // Move Y and Col
    p.y += p.vy * dt;
    p.onGround = false;
    
    let landed = false;

    // Platform Logic
    for (let plat of platforms) {
        // Floor check (simplified AABB, mainly checking landing from top)
        if (p.vy > 0 && p.y + p.h >= plat.y && p.y - p.vy * dt + p.h <= plat.y + 10 &&
            p.x + p.w > plat.x && p.x < plat.x + plat.w) {
            p.y = plat.y - p.h;
            p.vy = 0;
            p.onGround = true;
            p.jumpsLeft = p.maxJumps;
            landed = true;
        }
        // Ceiling check (optional, map borders mainly)
        if (p.vy < 0 && p.y <= plat.y + plat.h && p.y - p.vy * dt >= plat.y + plat.h - 10 &&
            p.x + p.w > plat.x && p.x < plat.x + plat.w) {
            p.y = plat.y + plat.h;
            p.vy = 0;
        }
    }

    if (landed && p.pounding) {
        p.pounding = false;
        if(isHost) triggerPound(p); // If client, host will validate when state syncs
        else {
            // Client visual prediction of blast
            for(let i=0; i<20; i++) particles.push(createParticle(p.x+p.w/2, p.y+p.h, '#ef4444', 150));
        }
    }
}

function doDash(dir) {
    const p = players[myId];
    p.vx = dir * DASH_SPEED;
    p.vy = 0;
    p.pounding = false;
}

// ==========================================
// RENDER & GAME LOOP
// ==========================================
function createParticle(x, y, color, speedMax) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speedMax;
    return {
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1.0, maxLife: 1.0 + Math.random(),
        color: color, size: Math.random() * 5 + 2
    };
}

let lastInputSend = 0;

function gameLoop(now) {
    requestAnimationFrame(gameLoop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;

    let me = players[myId];
    if (me && !isSpectating) {
        updatePlayerPhysics(me, dt);
        
        // Input sending
        if (now - lastInputSend > TICK_MS/2) {
            sendInputState();
            lastInputSend = now;
        }

        // Actions
        if (me.invulnTimer <= 0 && !me.isDead) {
            if (mouse.left && gunCooldown <= 0) {
                sendAction('shoot');
                gunCooldown = 200; // ms
            }
            if (mouse.right && nadeCooldown <= 0) {
                sendAction('grenade');
                nadeCooldown = me.cheats.grenadier ? 50 : 3000; // ms
            }
        }
    }

    if (gunCooldown > 0) gunCooldown -= dt * 1000;
    if (nadeCooldown > 0) nadeCooldown -= dt * 1000;

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += GRAVITY * dt * 0.5;
    }

    render();
    updateHUD();
}

function render() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Background Grid
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    let bgOffX = (cam.x * 0.2) % 100;
    let bgOffY = (cam.y * 0.2) % 100;
    for(let i = -100; i < canvas.width + 100; i+=100) {
        ctx.beginPath(); ctx.moveTo(i - bgOffX, 0); ctx.lineTo(i - bgOffX, canvas.height); ctx.stroke();
    }
    for(let i = -100; i < canvas.height + 100; i+=100) {
        ctx.beginPath(); ctx.moveTo(0, i - bgOffY); ctx.lineTo(canvas.width, i - bgOffY); ctx.stroke();
    }
    ctx.restore();

    // Camera follow
    let targetCamX = 0, targetCamY = 0;
    if (players[myId] && !isSpectating) {
        targetCamX = players[myId].x + players[myId].w/2 - canvas.width / (2 * cam.scale);
        targetCamY = players[myId].y + players[myId].h/2 - canvas.height / (2 * cam.scale);
    } else {
        // Free cam for spectator
        if (keys.a || keys.arrowleft) cam.x -= MOVE_SPEED * 2 * (lastTime/(lastTime-1));
        if (keys.d || keys.arrowright) cam.x += MOVE_SPEED * 2 * 0.016;
        if (keys.w || keys.arrowup) cam.y -= MOVE_SPEED * 2 * 0.016;
        if (keys.s || keys.arrowdown) cam.y += MOVE_SPEED * 2 * 0.016;
        targetCamX = cam.x;
        targetCamY = cam.y;
    }
    
    // Clamp cam to map
    targetCamX = Math.max(0, Math.min(MAP_W - canvas.width/cam.scale, targetCamX));
    targetCamY = Math.max(0, Math.min(MAP_H - canvas.height/cam.scale, targetCamY));
    
    cam.x += (targetCamX - cam.x) * 0.1;
    cam.y += (targetCamY - cam.y) * 0.1;

    ctx.save();
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.x, -cam.y);

    // Calc mouse angle world coords
    mouse.angle = Math.atan2(
        mouse.canvasY/cam.scale + cam.y - (players[myId]?.y + 20),
        mouse.canvasX/cam.scale + cam.x - (players[myId]?.x + 20)
    );

    // Draw Map
    for (let p of platforms) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // Top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(p.x, p.y, p.w, 5);
    }

    // Draw Drops
    for (let did in drops) {
        let d = drops[did];
        ctx.fillStyle = '#10b981'; // Emerald
        ctx.beginPath();
        ctx.arc(d.x, d.y, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 10; ctx.shadowColor = '#10b981';
        ctx.fill(); ctx.shadowBlur = 0;
    }

    // Draw Players
    for (let pid in players) {
        let p = players[pid];
        if (p.isDead) continue;

        // Smooth rendering for others
        if (pid !== myId || isSpectating) {
            p.rx += (p.x - p.rx) * 0.3;
            p.ry += (p.y - p.ry) * 0.3;
        } else {
            p.rx = p.x; p.ry = p.y;
        }

        ctx.save();
        ctx.translate(p.rx, p.ry);
        
        // Blink if invuln
        if (p.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        
        // Body
        ctx.fillStyle = pid === myId ? '#3b82f6' : '#ef4444';
        if (p.cheats?.god) ctx.fillStyle = '#eab308'; // Gold
        
        // Shape deformation for speed
        let stretchY = Math.max(1, 1 + Math.abs(p.vy)/2000);
        let stretchX = 1 / stretchY;
        if(p.pounding) { stretchY = 1.5; stretchX = 0.8; }
        
        ctx.scale(stretchX, stretchY);
        ctx.fillRect(0, 0, p.w/stretchX, p.h/stretchY);
        ctx.scale(1/stretchX, 1/stretchY);
        
        // Name & HP
        ctx.fillStyle = 'white';
        ctx.font = '12px bold Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.w/2, -15);
        
        // HP Bar
        ctx.fillStyle = '#334155';
        ctx.fillRect(-5, -10, p.w + 10, 5);
        let abs = getAbilities(p.xp);
        ctx.fillStyle = p.invulnTimer > 0 ? '#fbbf24' : '#22c55e';
        ctx.fillRect(-5, -10, (p.w + 10) * (p.hp / abs.maxHp), 5);
        
        ctx.restore();

        // Draw Gun
        ctx.save();
        ctx.translate(p.rx + p.w/2, p.ry + p.h/2);
        ctx.rotate(p.aimAngle);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(10, -3, 20, 6);
        ctx.restore();
    }

    // Draw Projectiles
    for (let pid in projectiles) {
        let pr = projectiles[pid];
        ctx.fillStyle = pr.color;
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, pr.radius, 0, Math.PI*2);
        ctx.fill();
        if (pr.type === 'grenade') {
            ctx.shadowBlur = 5; ctx.shadowColor = '#f97316'; ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = 'white'; ctx.font = '8px Arial'; ctx.fillText('N', pr.x-3, pr.y+3);
        } else {
            ctx.shadowBlur = 10; ctx.shadowColor = '#3b82f6'; ctx.fill(); ctx.shadowBlur = 0;
        }
    }

    // Draw Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

function updateHUD() {
    let me = players[myId];
    if (me && !isSpectating) {
        let abs = getAbilities(me.xp);
        
        document.getElementById('hud-name').innerText = me.name;
        document.getElementById('hud-level').innerText = `Lvl ${abs.level}`;
        
        let hpPct = Math.max(0, (me.hp / abs.maxHp) * 100);
        document.getElementById('hud-hp-bar').style.width = hpPct + '%';
        document.getElementById('hud-hp-txt').innerText = `${Math.floor(me.hp)}/${abs.maxHp}`;
        
        // XP progress to next level
        let nextLvlXp = LEVELS[Math.min(abs.level, LEVELS.length-1)].xp;
        let prevLvlXp = LEVELS[abs.level-1].xp;
        let xpPct = nextLvlXp > prevLvlXp ? ((me.xp - prevLvlXp) / (nextLvlXp - prevLvlXp)) * 100 : 100;
        document.getElementById('hud-xp-bar').style.width = xpPct + '%';

        document.getElementById('ab-double').style.color = abs.doubleJump ? '#10b981' : '#64748b';
        document.getElementById('ab-dash').style.color = abs.dash ? '#10b981' : '#64748b';
        document.getElementById('ab-pound').style.color = abs.pound ? '#10b981' : '#64748b';

        document.getElementById('cd-gun').style.height = ((200 - gunCooldown)/200)*100 + '%';
        
        let nadeMax = me.cheats.grenadier ? 50 : 3000;
        document.getElementById('cd-nade').style.height = ((nadeMax - nadeCooldown)/nadeMax)*100 + '%';

        if (me.isDead) {
            document.getElementById('center-message').classList.remove('hidden');
            document.getElementById('center-message-text').innerText = `RESPAWNING IN ${Math.ceil(me.respawnTimer/1000)}`;
        } else {
            document.getElementById('center-message').classList.add('hidden');
        }
    } else {
        document.getElementById('center-message').classList.remove('hidden');
        document.getElementById('center-message-text').innerText = isSpectating ? "SPECTATING" : "";
    }
}

function updateSidebar() {
    const list = document.getElementById('player-list');
    let html = '';
    let count = 0;
    
    for (let pid in players) {
        count++;
        let p = players[pid];
        let abs = getAbilities(p.xp);
        html += `
            <div class="bg-slate-800 rounded p-2 border border-slate-700 flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-sm ${pid === myId ? 'text-blue-400' : ''}">${p.name} ${p.isDead ? '💀' : ''}</span>
                    <span class="text-xs text-emerald-400 font-bold border border-emerald-500/30 bg-emerald-500/10 px-1 rounded">Lvl ${abs.level}</span>
                </div>
        `;
        
        // Host Controls for other players
        if (isHost && pid !== myId) {
            html += `
                <div class="flex flex-wrap gap-1 mt-1 pt-1 border-t border-slate-700/50">
                    <button onclick="hostOpCmd('${pid}', 'kick')" class="text-[10px] bg-red-900/50 hover:bg-red-800 text-red-200 px-1 rounded">Kick</button>
                    <button onclick="hostOpCmd('${pid}', 'god')" class="text-[10px] ${p.cheats.god ? 'bg-yellow-600' : 'bg-slate-700'} hover:bg-yellow-500 text-white px-1 rounded">God</button>
                    <button onclick="hostOpCmd('${pid}', 'shotgun')" class="text-[10px] ${p.cheats.shotgun ? 'bg-purple-600' : 'bg-slate-700'} hover:bg-purple-500 text-white px-1 rounded">Shotgun</button>
                    <button onclick="hostOpCmd('${pid}', 'grenadier')" class="text-[10px] ${p.cheats.grenadier ? 'bg-orange-600' : 'bg-slate-700'} hover:bg-orange-500 text-white px-1 rounded">No CD</button>
                </div>
            `;
        }
        
        html += `</div>`;
    }
    
    list.innerHTML = html;
    document.getElementById('player-count').innerText = `(${count})`;
}

</script>

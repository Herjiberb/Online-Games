<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Arena Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a202c; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-canvas { display: block; width: 100%; height: 100%; background-color: #2d3748; }
        .hidden { display: none !important; }
        .ui-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        
        /* Custom Scrollbar for Player List */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="text-white select-none">

    <!-- CANVAS -->
    <canvas id="game-canvas" class="hidden"></canvas>

    <!-- MAIN MENU -->
    <div id="main-menu" class="absolute inset-0 flex items-center justify-center bg-gray-900 z-50">
        <div class="ui-panel p-8 max-w-md w-full flex flex-col items-center shadow-2xl">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">ARENA BRAWL</h1>
            <p class="text-gray-400 mb-8 text-sm">WebRTC P2P Multiplayer Shooter</p>

            <div class="w-full mb-6">
                <label class="block text-sm font-medium text-gray-300 mb-1">Player Name</label>
                <input type="text" id="player-name" maxlength="15" placeholder="Enter your name" class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-white placeholder-gray-500">
            </div>

            <button id="btn-host-menu" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold transition mb-4 shadow-lg shadow-blue-500/20">Host New Game</button>
            
            <div class="flex items-center w-full mb-4">
                <hr class="flex-grow border-gray-700">
                <span class="px-3 text-gray-500 text-sm">OR</span>
                <hr class="flex-grow border-gray-700">
            </div>

            <div class="w-full flex gap-2">
                <input type="text" id="join-code" placeholder="Enter Room Code" class="flex-grow px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-purple-500 text-white placeholder-gray-500 uppercase">
                <button id="btn-join" class="px-6 py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold transition shadow-lg shadow-purple-500/20">Join</button>
            </div>
            <p id="menu-error" class="text-red-400 text-sm mt-4 hidden"></p>
        </div>
    </div>

    <!-- HUD OVERLAY (For Players) -->
    <div id="hud-overlay" class="absolute inset-0 pointer-events-none hidden z-30">
        <div class="absolute bottom-6 left-6 right-6 flex justify-between items-end">
            <div class="flex flex-col gap-2 pointer-events-auto">
                <div class="text-2xl font-bold bg-black/50 px-4 py-2 rounded-lg">
                    <span id="hud-hp" class="text-green-400">1000</span> <span class="text-gray-400 text-sm">/ <span id="hud-maxhp">1000</span> HP</span>
                </div>
                <div class="text-xl font-bold bg-black/50 px-4 py-2 rounded-lg">
                    <span id="hud-xp" class="text-yellow-400">0</span> <span class="text-gray-400 text-sm">XP</span>
                </div>
                <div id="hud-unlocks" class="text-sm text-blue-300 bg-black/50 px-4 py-2 rounded-lg max-w-xs">
                    Unlocks: None
                </div>
            </div>
            
            <div class="flex gap-4 pointer-events-auto">
                <div class="bg-black/50 p-3 rounded-lg text-center w-24">
                    <div class="text-gray-400 text-xs mb-1">GRENADE (Right Click)</div>
                    <div class="h-2 bg-gray-700 rounded overflow-hidden">
                        <div id="hud-grenade-cd" class="h-full bg-orange-500 w-full transition-all duration-100"></div>
                    </div>
                </div>
                <div class="bg-black/50 p-3 rounded-lg text-center w-24">
                    <div class="text-gray-400 text-xs mb-1">DASH (Double Tap)</div>
                    <div class="h-2 bg-gray-700 rounded overflow-hidden">
                        <div id="hud-dash-cd" class="h-full bg-cyan-400 w-full transition-all duration-100"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="respawn-overlay" class="absolute inset-0 bg-red-900/40 backdrop-blur-sm flex flex-col items-center justify-center hidden">
            <h2 class="text-5xl font-black text-white mb-4 drop-shadow-lg">YOU DIED</h2>
            <p class="text-2xl text-gray-200 font-bold">Respawning in <span id="respawn-timer" class="text-yellow-400">15</span>s</p>
        </div>
    </div>

    <!-- HOST DASHBOARD -->
    <div id="host-dashboard" class="absolute top-4 right-4 w-80 ui-panel p-4 hidden z-40 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-blue-400">Host Dashboard</h2>
            <button id="btn-host-toggle-play" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">Play</button>
        </div>
        
        <div class="bg-black/40 p-3 rounded-lg mb-4 text-center cursor-pointer hover:bg-black/60 transition" onclick="copyCode()" title="Click to copy">
            <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Room Code</div>
            <div id="host-room-code" class="text-2xl font-mono font-bold tracking-widest text-white">...</div>
        </div>

        <h3 class="text-sm font-semibold text-gray-400 border-b border-gray-700 pb-2 mb-2">Players (<span id="player-count">0</span>)</h3>
        <div id="player-list" class="flex-grow overflow-y-auto space-y-2">
            <!-- Player rows go here -->
        </div>
    </div>

    <!-- CHEATS MODAL (Host only) -->
    <div id="cheats-modal" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden z-50">
        <div class="ui-panel p-6 max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4">OP Panel: <span id="cheat-target-name" class="text-purple-400">Player</span></h2>
            
            <div class="space-y-4 mb-6">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="cheat-god" class="w-5 h-5 rounded text-purple-500 focus:ring-purple-500 bg-gray-700 border-gray-600">
                    <span class="text-gray-200">God Mode (Immunity)</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="cheat-shotgun" class="w-5 h-5 rounded text-purple-500 focus:ring-purple-500 bg-gray-700 border-gray-600">
                    <span class="text-gray-200">Shotgun Blast (10x projectiles)</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="cheat-grenadier" class="w-5 h-5 rounded text-purple-500 focus:ring-purple-500 bg-gray-700 border-gray-600">
                    <span class="text-gray-200">Grenadier (No Cooldown)</span>
                </label>
            </div>

            <div class="flex justify-end gap-2">
                <button id="btn-close-cheats" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded">Close</button>
            </div>
        </div>
    </div>

<script>
// --- UTILS & CONSTANTS ---
const ID_PREFIX = "BRAWL-";
function generateRoomCode() { return ID_PREFIX + Math.random().toString(36).substring(2, 8).toUpperCase(); }
function copyCode() { 
    navigator.clipboard.writeText(document.getElementById('host-room-code').innerText);
    alert("Code copied to clipboard!");
}

// XP Thresholds
const UNLOCKS = {
    DASH: 200,
    POUND: 500,
    HIGH_JUMP: 1000,
    HP_BOOST_INTERVAL: 500 // Every 500 XP = +100 Max HP
};

// Map Definition (Super Big)
const MAP_W = 4000;
const MAP_H = 3000;
const PLATFORMS = [
    // Borders
    { x: -50, y: 0, w: 50, h: MAP_H },
    { x: MAP_W, y: 0, w: 50, h: MAP_H },
    { x: 0, y: -50, w: MAP_W, h: 50 },
    { x: 0, y: MAP_H - 100, w: MAP_W, h: 200 }, // Ground

    // Center Main Hub
    { x: 1500, y: 2400, w: 1000, h: 40 },
    { x: 1700, y: 2000, w: 600, h: 40 },
    { x: 1900, y: 1600, w: 200, h: 40 },

    // Left Side Platforms
    { x: 400, y: 2500, w: 400, h: 40 },
    { x: 200, y: 2100, w: 400, h: 40 },
    { x: 600, y: 1700, w: 400, h: 40 },
    { x: 100, y: 1300, w: 300, h: 40 },
    { x: 800, y: 1000, w: 400, h: 40 },

    // Right Side Platforms
    { x: 3200, y: 2500, w: 400, h: 40 },
    { x: 3400, y: 2100, w: 400, h: 40 },
    { x: 3000, y: 1700, w: 400, h: 40 },
    { x: 3600, y: 1300, w: 300, h: 40 },
    { x: 2800, y: 1000, w: 400, h: 40 },

    // Top scattered
    { x: 1500, y: 1200, w: 200, h: 40 },
    { x: 2300, y: 1200, w: 200, h: 40 },
    { x: 1900, y: 800, w: 200, h: 40 },
];

const SPAWNS = [
    {x: 200, y: 2800}, {x: 3800, y: 2800}, {x: 2000, y: 2300}, 
    {x: 400, y: 1900}, {x: 3600, y: 1900}, {x: 2000, y: 1500},
    {x: 250, y: 1100}, {x: 3750, y: 1100}, {x: 2000, y: 700}
];

// --- GLOBALS ---
let peer = null;
let isHost = false;
let hostPlaying = false; // Host can spectate or play
let myId = null;
let myName = "";
let currentCode = "";
let connections = {}; // Host: stores active DataConnections

let keys = { w:false, a:false, s:false, d:false };
let mouse = { x: 0, y: 0, screenX: 0, screenY: 0, left: false, right: false };
let camera = { x: 0, y: 0 };
let localState = { players: {}, bullets: [], grenades: [], drops: [] };
let lastDashTimes = { left: 0, right: 0 };
let renderState = {}; // For interpolation

const P_W = 40, P_H = 60; // Player dimensions

// --- HOST LOGIC & CLASSES (Authoritative) ---
class HostPlayer {
    constructor(id, name) {
        this.id = id;
        this.name = name;
        this.color = `hsl(${Math.random()*360}, 80%, 60%)`;
        this.width = P_W;
        this.height = P_H;
        this.reset();
        this.cheats = { god: false, shotgun: false, grenadier: false };
        this.keys = {};
        this.mouseAngle = 0;
        this.clicking = false;
        this.rClicking = false;
    }

    reset() {
        let spawn = SPAWNS[Math.floor(Math.random() * SPAWNS.length)];
        this.x = spawn.x;
        this.y = spawn.y - 100;
        this.vx = 0;
        this.vy = 0;
        this.baseMaxHp = 1000;
        this.hp = 1000;
        this.xp = 0;
        this.jumps = 2;
        this.grounded = false;
        this.dashCooldown = 0;
        this.shootCooldown = 0;
        this.grenadeCooldown = 0;
        this.isPounding = false;
        this.iFrames = 2000; // 2 seconds iFrames on spawn
        this.deadTimer = 0; // 0 = alive
        this.updateStats();
    }

    updateStats() {
        let bonusHp = Math.floor(this.xp / UNLOCKS.HP_BOOST_INTERVAL) * 100;
        this.maxHp = this.baseMaxHp + bonusHp;
        if(this.hp > this.maxHp) this.hp = this.maxHp;
        this.canDash = this.xp >= UNLOCKS.DASH;
        this.canPound = this.xp >= UNLOCKS.POUND;
        this.highJump = this.xp >= UNLOCKS.HIGH_JUMP;
    }

    die(killerId) {
        if(this.deadTimer > 0) return;
        this.deadTimer = 15000; // 15 seconds
        
        // Drop XP and Life
        hostState.drops.push(new HostDrop(this.x, this.y, this.xp + 100)); // All their XP + 100 base
        
        // Optional: Notify
        this.hp = 0;
        this.xp = 0;
    }

    update(dt) {
        if(this.deadTimer > 0) {
            this.deadTimer -= dt;
            if(this.deadTimer <= 0) this.reset();
            return;
        }

        if(this.iFrames > 0) this.iFrames -= dt;
        if(this.dashCooldown > 0) this.dashCooldown -= dt;
        if(this.shootCooldown > 0) this.shootCooldown -= dt;
        if(this.grenadeCooldown > 0) this.grenadeCooldown -= dt;

        // Apply Input (if not pounding wildly)
        if(!this.isPounding) {
            let moveSpeed = 6;
            if (this.keys.a) this.vx -= 1.5;
            if (this.keys.d) this.vx += 1.5;
            this.vx *= 0.8; // friction
            if(Math.abs(this.vx) > moveSpeed && this.dashCooldown < 800) { // Limit normal speed unless dashing
                this.vx = Math.sign(this.vx) * moveSpeed;
            }
        }

        // Gravity
        this.vy += 0.6; 
        if(this.vy > 25) this.vy = 25; // Terminal velocity

        // Movement & Collisions X
        this.x += this.vx;
        for(let p of PLATFORMS) {
            if(this.checkOverlap(p)) {
                if(this.vx > 0) { this.x = p.x - this.width; this.vx = 0; }
                else if(this.vx < 0) { this.x = p.x + p.w; this.vx = 0; }
            }
        }

        // Movement & Collisions Y
        this.y += this.vy;
        this.grounded = false;
        for(let p of PLATFORMS) {
            if(this.checkOverlap(p)) {
                if(this.vy > 0) { 
                    this.y = p.y - this.height; 
                    this.vy = 0; 
                    this.grounded = true; 
                    this.jumps = 2;
                    if(this.isPounding) {
                        this.isPounding = false;
                        this.doPoundSplash();
                    }
                }
                else if(this.vy < 0) { this.y = p.y + p.h; this.vy = 0; }
            }
        }

        // Keep in bounds strictly
        if(this.y > MAP_H + 100) this.die(null);

        // Actions
        if(this.clicking && this.shootCooldown <= 0 && this.iFrames <= 0) {
            this.shoot();
            this.shootCooldown = 200; // Fast shots
        }
        if(this.rClicking && this.grenadeCooldown <= 0 && this.iFrames <= 0) {
            this.throwGrenade();
            this.grenadeCooldown = this.cheats.grenadier ? 0 : 5000;
        }
    }

    checkOverlap(rect) {
        return this.x < rect.x + rect.w && this.x + this.width > rect.x &&
               this.y < rect.y + rect.h && this.y + this.height > rect.y;
    }

    jump() {
        if(this.deadTimer > 0) return;
        if(this.grounded || this.jumps > 0) {
            this.vy = this.highJump ? -16 : -13;
            this.jumps--;
            this.grounded = false;
            this.isPounding = false;
        }
    }

    dash(dir) {
        if(this.deadTimer > 0 || !this.canDash || this.dashCooldown > 0) return;
        this.vx = dir * 25;
        this.dashCooldown = 1500;
    }

    pound() {
        if(this.deadTimer > 0 || !this.canPound || this.grounded) return;
        this.isPounding = true;
        this.vy = 30; // Slam down
    }

    shoot() {
        let speed = 20;
        if(this.cheats.shotgun) {
            for(let i=-4; i<=4; i++) {
                let a = this.mouseAngle + (i * 0.1);
                hostState.bullets.push(new HostBullet(this.x + this.width/2, this.y + this.height/2, Math.cos(a)*speed, Math.sin(a)*speed, this.id));
            }
        } else {
            hostState.bullets.push(new HostBullet(this.x + this.width/2, this.y + this.height/2, Math.cos(this.mouseAngle)*speed, Math.sin(this.mouseAngle)*speed, this.id));
        }
    }

    throwGrenade() {
        let speed = 15;
        hostState.grenades.push(new HostGrenade(this.x + this.width/2, this.y + this.height/2, Math.cos(this.mouseAngle)*speed, Math.sin(this.mouseAngle)*speed - 5, this.id));
    }

    doPoundSplash() {
        hostState.effects.push({x: this.x + this.width/2, y: this.y + this.height, type: 'pound'});
        let cx = this.x + this.width/2;
        let cy = this.y + this.height;
        for(let pid in hostState.players) {
            let target = hostState.players[pid];
            if(pid !== this.id && target.deadTimer <= 0 && target.iFrames <= 0 && !target.cheats.god) {
                let dx = (target.x + target.width/2) - cx;
                let dy = (target.y + target.height/2) - cy;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 200) {
                    target.takeDamage(200, this.id);
                    target.vy -= 10;
                    target.vx += Math.sign(dx) * 15;
                }
            }
        }
    }

    takeDamage(amt, attackerId) {
        if(this.deadTimer > 0 || this.iFrames > 0 || this.cheats.god) return;
        this.hp -= amt;
        if(this.hp <= 0) {
            this.die(attackerId);
            if(attackerId && hostState.players[attackerId]) {
                hostState.players[attackerId].hp = Math.min(hostState.players[attackerId].maxHp, hostState.players[attackerId].hp + 200); // Heal on kill
            }
        }
    }
}

class HostBullet {
    constructor(x, y, vx, vy, owner) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.owner = owner;
        this.life = 100;
        this.dead = false;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.life--;
        if(this.life <= 0) this.dead = true;
        
        // Map coll
        for(let p of PLATFORMS) {
            if(this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) { this.dead = true; return; }
        }

        // Player coll
        for(let pid in hostState.players) {
            if(pid === this.owner) continue;
            let p = hostState.players[pid];
            if(p.deadTimer <= 0 && this.x > p.x && this.x < p.x + p.width && this.y > p.y && this.y < p.y + p.height) {
                p.takeDamage(50, this.owner);
                this.dead = true;
                return;
            }
        }
    }
}

class HostGrenade {
    constructor(x, y, vx, vy, owner) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.owner = owner;
        this.timer = 2000;
        this.dead = false;
    }
    update(dt) {
        this.vy += 0.4;
        this.x += this.vx; this.y += this.vy;
        
        // Bounce
        for(let p of PLATFORMS) {
            if(this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) {
                // simple revert and bounce
                this.y -= this.vy; this.vy *= -0.5;
                this.x -= this.vx; this.vx *= 0.8;
            }
        }
        
        this.timer -= dt;
        if(this.timer <= 0) {
            this.explode();
        }
    }
    explode() {
        this.dead = true;
        hostState.effects.push({x: this.x, y: this.y, type: 'grenade'});
        for(let pid in hostState.players) {
            let p = hostState.players[pid];
            if(p.deadTimer <= 0 && p.iFrames <= 0 && !p.cheats.god) {
                let dx = (p.x + p.width/2) - this.x;
                let dy = (p.y + p.height/2) - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 250) {
                    let dmg = Math.max(50, 300 - dist); // Falloff damage
                    p.takeDamage(dmg, this.owner);
                    p.vx += (dx/dist) * 20;
                    p.vy += (dy/dist) * 20;
                }
            }
        }
    }
}

class HostDrop {
    constructor(x, y, xp) {
        this.x = x; this.y = y; this.xp = xp; this.vy = -10; this.vx = (Math.random()-0.5)*10;
        this.dead = false;
        this.life = 30000; // 30s disappear
    }
    update(dt) {
        this.vy += 0.5; this.x += this.vx; this.y += this.vy; this.vx *= 0.95;
        for(let p of PLATFORMS) {
            if(this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) {
                this.y -= this.vy; this.vy = 0; this.vx = 0;
            }
        }
        
        for(let pid in hostState.players) {
            let p = hostState.players[pid];
            if(p.deadTimer <= 0 && this.x > p.x - 20 && this.x < p.x + p.width + 20 && this.y > p.y - 20 && this.y < p.y + p.height + 20) {
                p.xp += this.xp;
                p.hp = Math.min(p.maxHp, p.hp + 150); // Heal a bit
                p.updateStats();
                this.dead = true;
                return;
            }
        }

        this.life -= dt;
        if(this.life <= 0) this.dead = true;
    }
}

let hostState = { players: {}, bullets: [], grenades: [], drops: [], effects: [] };
let hostInterval = null;
let targetCheatId = null;

function startHostGame() {
    isHost = true;
    hostPlaying = true;
    currentCode = generateRoomCode();
    myId = "host";
    
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('host-dashboard').classList.remove('hidden');
    document.getElementById('host-room-code').innerText = currentCode.replace(ID_PREFIX, '');
    
    // Init Peer
    peer = new Peer(currentCode);
    peer.on('open', (id) => { console.log("Host ready:", id); });
    peer.on('connection', (conn) => {
        conn.on('data', (data) => handleClientData(conn.peer, data));
        conn.on('close', () => { removePlayer(conn.peer); });
    });

    // Add Host as player
    hostState.players[myId] = new HostPlayer(myId, myName);
    
    // Host Logic Loop (40 FPS)
    let lastTime = performance.now();
    hostInterval = setInterval(() => {
        let now = performance.now();
        let dt = now - lastTime;
        lastTime = now;

        // Host Local Inputs
        if(hostPlaying && hostState.players[myId]) {
            let hp = hostState.players[myId];
            hp.keys = {...keys};
            hp.clicking = mouse.left;
            hp.rClicking = mouse.right;
            hp.mouseAngle = Math.atan2(mouse.screenY - window.innerHeight/2, mouse.screenX - window.innerWidth/2);
            // Jumps/Dashes handled directly by events
        }

        // Update physics
        for(let id in hostState.players) hostState.players[id].update(dt);
        
        hostState.bullets.forEach(b => b.update());
        hostState.bullets = hostState.bullets.filter(b => !b.dead);

        hostState.grenades.forEach(g => g.update(dt));
        hostState.grenades = hostState.grenades.filter(g => !g.dead);

        hostState.drops.forEach(d => d.update(dt));
        hostState.drops = hostState.drops.filter(d => !d.dead);

        // Prep sync package
        let syncData = { 
            players: {}, 
            bullets: hostState.bullets.map(b => [Math.round(b.x), Math.round(b.y)]), 
            grenades: hostState.grenades.map(g => [Math.round(g.x), Math.round(g.y)]), 
            drops: hostState.drops.map(d => [Math.round(d.x), Math.round(d.y), d.xp]),
            effects: hostState.effects 
        };
        for(let id in hostState.players) {
            let p = hostState.players[id];
            syncData.players[id] = {
                x: Math.round(p.x), y: Math.round(p.y), vx: Math.round(p.vx), vy: Math.round(p.vy),
                hp: p.hp, maxHp: p.maxHp, xp: p.xp, name: p.name, color: p.color,
                iFrames: p.iFrames > 0, dead: p.deadTimer > 0, deadTimer: Math.round(p.deadTimer),
                dashCd: p.dashCooldown, grenadeCd: p.grenadeCooldown, isPounding: p.isPounding
            };
        }
        
        hostState.effects = []; // clear effects

        // Update Local state for rendering immediately
        localState = JSON.parse(JSON.stringify(syncData)); 

        // Broadcast to clients
        let payload = JSON.stringify({type: 'state', state: syncData});
        for(let id in connections) {
            if(connections[id].open) connections[id].send(payload);
        }

        updateHostUI();

    }, 1000/40); // 40 Hz server

    startGameClient();
}

function handleClientData(clientId, data) {
    let p = hostState.players[clientId];
    if(data.type === 'join') {
        hostState.players[clientId] = new HostPlayer(clientId, data.name.substring(0, 15));
        connections[clientId] = peer.connections[clientId][0];
    }
    else if(data.type === 'input' && p) {
        p.keys = data.keys;
        p.clicking = data.mouse.left;
        p.rClicking = data.mouse.right;
        p.mouseAngle = data.mouse.angle;
    }
    else if(data.type === 'action' && p) {
        if(data.action === 'jump') p.jump();
        else if(data.action === 'dash') p.dash(data.dir);
        else if(data.action === 'pound') p.pound();
    }
}

function removePlayer(id) {
    delete hostState.players[id];
    delete connections[id];
}

function hostKickPlayer(id) {
    if(connections[id]) {
        connections[id].send(JSON.stringify({type: 'kicked'}));
        setTimeout(() => { connections[id].close(); removePlayer(id); }, 100);
    }
}

function hostOpPlayer(id) {
    targetCheatId = id;
    let p = hostState.players[id];
    if(!p) return;
    document.getElementById('cheat-target-name').innerText = p.name;
    document.getElementById('cheat-god').checked = p.cheats.god;
    document.getElementById('cheat-shotgun').checked = p.cheats.shotgun;
    document.getElementById('cheat-grenadier').checked = p.cheats.grenadier;
    document.getElementById('cheats-modal').classList.remove('hidden');
}

document.getElementById('cheat-god').addEventListener('change', e => { if(hostState.players[targetCheatId]) hostState.players[targetCheatId].cheats.god = e.target.checked; });
document.getElementById('cheat-shotgun').addEventListener('change', e => { if(hostState.players[targetCheatId]) hostState.players[targetCheatId].cheats.shotgun = e.target.checked; });
document.getElementById('cheat-grenadier').addEventListener('change', e => { if(hostState.players[targetCheatId]) hostState.players[targetCheatId].cheats.grenadier = e.target.checked; });
document.getElementById('btn-close-cheats').addEventListener('click', () => { document.getElementById('cheats-modal').classList.add('hidden'); });

function updateHostUI() {
    document.getElementById('player-count').innerText = Object.keys(hostState.players).length;
    let listHTML = '';
    for(let id in hostState.players) {
        let p = hostState.players[id];
        let isMe = id === myId;
        listHTML += `
            <div class="flex justify-between items-center bg-gray-800 p-2 rounded text-sm">
                <span class="font-bold truncate w-24" style="color:${p.color}">${p.name} ${isMe?"(Host)":""}</span>
                <span class="text-xs text-gray-400 w-16 text-right">${p.xp} XP</span>
                <div class="flex gap-1">
                    <button onclick="hostOpPlayer('${id}')" class="px-2 py-1 bg-purple-600 hover:bg-purple-500 rounded text-xs">OP</button>
                    ${!isMe ? `<button onclick="hostKickPlayer('${id}')" class="px-2 py-1 bg-red-600 hover:bg-red-500 rounded text-xs">Kick</button>` : ''}
                </div>
            </div>`;
    }
    document.getElementById('player-list').innerHTML = listHTML;
}

document.getElementById('btn-host-toggle-play').addEventListener('click', (e) => {
    hostPlaying = !hostPlaying;
    e.target.innerText = hostPlaying ? "Spectating" : "Playing"; // It toggles state
    e.target.classList.toggle('bg-blue-600');
    if(!hostPlaying) {
        if(hostState.players[myId]) hostState.players[myId].deadTimer = 999999; // Essentially hide them
    } else {
        if(hostState.players[myId]) hostState.players[myId].reset();
    }
});


// --- CLIENT LOGIC ---
let clientEffects = [];

function joinGame(code) {
    document.getElementById('menu-error').classList.add('hidden');
    currentCode = ID_PREFIX + code.toUpperCase().replace(ID_PREFIX, '');
    peer = new Peer();
    
    peer.on('open', (id) => {
        myId = id;
        let conn = peer.connect(currentCode);
        conn.on('open', () => {
            document.getElementById('main-menu').classList.add('hidden');
            conn.send({type: 'join', name: myName});
            connections['host'] = conn;
            startGameClient();
        });
        
        conn.on('data', (dataStr) => {
            let data = JSON.parse(dataStr);
            if(data.type === 'state') {
                localState = data.state;
                // Add effects
                if(data.state.effects) {
                    data.state.effects.forEach(e => {
                        clientEffects.push({x: e.x, y: e.y, type: e.type, radius: 0, alpha: 1});
                    });
                }
            } else if (data.type === 'kicked') {
                alert("You have been kicked by the host.");
                location.reload();
            }
        });
        
        conn.on('close', () => { alert("Host disconnected."); location.reload(); });
        conn.on('error', () => { showMenuError("Connection failed. Invalid code?"); });
    });
    peer.on('error', (err) => { showMenuError("Peer error: " + err.type); });
}

function showMenuError(msg) {
    let el = document.getElementById('menu-error');
    el.innerText = msg;
    el.classList.remove('hidden');
}

function startGameClient() {
    document.getElementById('game-canvas').classList.remove('hidden');
    document.getElementById('hud-overlay').classList.remove('hidden');
    
    // Client input loop (send to host)
    if(!isHost) {
        setInterval(() => {
            if(connections['host'] && connections['host'].open) {
                // Calculate angle based on camera
                let playerX = window.innerWidth/2;
                let playerY = window.innerHeight/2;
                // Actually, if we are near map edge, player isn't in center. 
                // We use stored screen pos of player.
                let angle = Math.atan2(mouse.screenY - mouse.pScreenY, mouse.screenX - mouse.pScreenX);
                
                connections['host'].send({
                    type: 'input',
                    keys: keys,
                    mouse: { left: mouse.left, right: mouse.right, angle: angle }
                });
            }
        }, 1000/30); // send inputs at 30hz
    }

    requestAnimationFrame(renderLoop);
}

// Input Handlers
window.addEventListener('keydown', e => {
    let key = e.key.toLowerCase();
    if(key === 'w' || key === 'arrowup' || key === ' ') {
        keys.w = true; sendAction('jump');
    }
    if(key === 's' || key === 'arrowdown') {
        keys.s = true; sendAction('pound');
    }
    if(key === 'a' || key === 'arrowleft') {
        keys.a = true;
        let now = Date.now();
        if(now - lastDashTimes.left < 250) sendAction('dash', -1);
        lastDashTimes.left = now;
    }
    if(key === 'd' || key === 'arrowright') {
        keys.d = true;
        let now = Date.now();
        if(now - lastDashTimes.right < 250) sendAction('dash', 1);
        lastDashTimes.right = now;
    }
});
window.addEventListener('keyup', e => {
    let key = e.key.toLowerCase();
    if(key === 'w' || key === 'arrowup' || key === ' ') keys.w = false;
    if(key === 'a' || key === 'arrowleft') keys.a = false;
    if(key === 's' || key === 'arrowdown') keys.s = false;
    if(key === 'd' || key === 'arrowright') keys.d = false;
});

window.addEventListener('mousemove', e => { mouse.screenX = e.clientX; mouse.screenY = e.clientY; });
window.addEventListener('mousedown', e => { if(e.button === 0) mouse.left = true; if(e.button === 2) mouse.right = true; });
window.addEventListener('mouseup', e => { if(e.button === 0) mouse.left = false; if(e.button === 2) mouse.right = false; });
window.addEventListener('contextmenu', e => e.preventDefault()); // Prevent right click menu

function sendAction(action, dir=0) {
    if(isHost && hostPlaying && hostState.players[myId]) {
        if(action === 'jump') hostState.players[myId].jump();
        if(action === 'dash') hostState.players[myId].dash(dir);
        if(action === 'pound') hostState.players[myId].pound();
    } else if(!isHost && connections['host'] && connections['host'].open) {
        connections['host'].send({type: 'action', action: action, dir: dir});
    }
}

// --- RENDERING ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function renderLoop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let me = localState.players[myId];

    // Smooth Camera Follow
    if(me && !me.dead && (isHost ? hostPlaying : true)) {
        let targetCamX = me.x + P_W/2 - canvas.width/2;
        let targetCamY = me.y + P_H/2 - canvas.height/2;
        // Clamp camera to map
        targetCamX = Math.max(0, Math.min(MAP_W - canvas.width, targetCamX));
        targetCamY = Math.max(0, Math.min(MAP_H - canvas.height, targetCamY));
        
        camera.x += (targetCamX - camera.x) * 0.1;
        camera.y += (targetCamY - camera.y) * 0.1;
        
        mouse.pScreenX = me.x + P_W/2 - camera.x;
        mouse.pScreenY = me.y + P_H/2 - camera.y;
    } else {
        // Free camera or spectate
        mouse.pScreenX = canvas.width/2;
        mouse.pScreenY = canvas.height/2;
    }

    ctx.fillStyle = '#1e293b'; // Background
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Draw Grid (Arena feel)
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    let gSize = 100;
    let startX = Math.floor(camera.x / gSize) * gSize;
    let startY = Math.floor(camera.y / gSize) * gSize;
    ctx.beginPath();
    for(let x = startX; x < camera.x + canvas.width; x += gSize) { ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + canvas.height); }
    for(let y = startY; y < camera.y + canvas.height; y += gSize) { ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + canvas.width, y); }
    ctx.stroke();

    // Draw Platforms
    ctx.fillStyle = '#475569';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 10;
    for(let p of PLATFORMS) {
        // Only draw visible
        if(p.x + p.w > camera.x && p.x < camera.x + canvas.width && p.y + p.h > camera.y && p.y < camera.y + canvas.height) {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Neon accent edge
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(p.x, p.y, p.w, 4);
            ctx.fillStyle = '#475569';
        }
    }
    ctx.shadowBlur = 0;

    // Interpolate & Draw Players
    for(let id in localState.players) {
        let p = localState.players[id];
        if(p.dead) continue;

        if(!renderState[id]) renderState[id] = {x: p.x, y: p.y};
        
        // Simple Lerp
        renderState[id].x += (p.x - renderState[id].x) * 0.4;
        renderState[id].y += (p.y - renderState[id].y) * 0.4;
        
        let rx = renderState[id].x;
        let ry = renderState[id].y;

        ctx.globalAlpha = p.iFrames ? 0.5 : 1.0;

        // Draw Player Box
        ctx.fillStyle = p.color;
        ctx.fillRect(rx, ry, P_W, P_H);
        
        // Eye direction
        ctx.fillStyle = 'white';
        let lookDir = p.vx > 0 ? 1 : (p.vx < 0 ? -1 : 0);
        if(lookDir === 0) lookDir = 1; // default
        ctx.fillRect(rx + P_W/2 + (lookDir*10) - 5, ry + 15, 10, 10);
        ctx.fillStyle = 'black';
        ctx.fillRect(rx + P_W/2 + (lookDir*10) - 2 + (lookDir*2), ry + 17, 6, 6);

        // Pound trail
        if(p.isPounding) {
            ctx.fillStyle = 'rgba(255, 200, 0, 0.5)';
            ctx.fillRect(rx+5, ry - 40, P_W-10, 40);
        }

        ctx.globalAlpha = 1.0;

        // Name
        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, rx + P_W/2, ry - 15);

        // Health Bar
        let hpPct = p.hp / p.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(rx - 10, ry - 10, P_W + 20, 6);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(rx - 10, ry - 10, (P_W + 20) * hpPct, 6);
    }

    // Draw Drops (XP/Life)
    for(let d of localState.drops) {
        ctx.fillStyle = '#fbbf24'; // Yellow
        ctx.beginPath();
        ctx.arc(d[0], d[1], 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif';
        ctx.fillText("XP", d[0], d[1]+3);
    }

    // Draw Bullets
    ctx.fillStyle = '#fde047';
    for(let b of localState.bullets) {
        ctx.beginPath();
        ctx.arc(b[0], b[1], 4, 0, Math.PI*2);
        ctx.fill();
    }

    // Draw Grenades
    ctx.fillStyle = '#ea580c';
    for(let g of localState.grenades) {
        ctx.beginPath();
        ctx.arc(g[0], g[1], 6, 0, Math.PI*2);
        ctx.fill();
    }

    // Process & Draw Effects
    for(let i = clientEffects.length - 1; i >= 0; i--) {
        let e = clientEffects[i];
        if(e.type === 'grenade') {
            e.radius += 15;
            e.alpha -= 0.05;
            ctx.fillStyle = `rgba(234, 88, 12, ${e.alpha})`;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
        } else if (e.type === 'pound') {
            e.radius += 20;
            e.alpha -= 0.08;
            ctx.fillStyle = `rgba(56, 189, 248, ${e.alpha})`;
            ctx.fillRect(e.x - e.radius, e.y - 10, e.radius*2, 20);
        }
        if(e.alpha <= 0) clientEffects.splice(i, 1);
    }

    ctx.restore();

    // Update HUD
    if(me && (isHost ? hostPlaying : true)) {
        document.getElementById('hud-overlay').classList.remove('hidden');
        document.getElementById('hud-hp').innerText = Math.round(me.hp);
        document.getElementById('hud-maxhp').innerText = me.maxHp;
        document.getElementById('hud-xp').innerText = me.xp;
        
        let unlocks = [];
        if(me.xp >= UNLOCKS.DASH) unlocks.push("Dash");
        if(me.xp >= UNLOCKS.POUND) unlocks.push("Ground Pound");
        if(me.xp >= UNLOCKS.HIGH_JUMP) unlocks.push("High Jump");
        document.getElementById('hud-unlocks').innerText = "Unlocks: " + (unlocks.length > 0 ? unlocks.join(', ') : "None");

        let dashPct = me.dashCd <= 0 ? 100 : 100 - (me.dashCd / 1500)*100;
        let grenPct = me.grenadeCd <= 0 ? 100 : 100 - (me.grenadeCd / 5000)*100;
        
        document.getElementById('hud-dash-cd').style.width = dashPct + '%';
        document.getElementById('hud-grenade-cd').style.width = grenPct + '%';

        if(me.dead) {
            document.getElementById('respawn-overlay').classList.remove('hidden');
            document.getElementById('respawn-timer').innerText = Math.ceil(me.deadTimer / 1000);
        } else {
            document.getElementById('respawn-overlay').classList.add('hidden');
        }
    } else {
        document.getElementById('hud-overlay').classList.add('hidden');
    }

    requestAnimationFrame(renderLoop);
}

// --- INIT BUTTONS ---
document.getElementById('btn-host-menu').addEventListener('click', () => {
    myName = document.getElementById('player-name').value.trim() || "HostPlayer";
    startHostGame();
});

document.getElementById('btn-join').addEventListener('click', () => {
    myName = document.getElementById('player-name').value.trim() || "Player" + Math.floor(Math.random()*100);
    let code = document.getElementById('join-code').value.trim();
    if(code.length < 4) return showMenuError("Please enter a valid room code.");
    joinGame(code);
});

// Setup Initial Screen
document.getElementById('player-name').value = "Player" + Math.floor(Math.random()*999);

</script>
